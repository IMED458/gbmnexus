var stripTags=function(h){ var d=document.createElement('div'); d.innerHTML=String(h==null?'':h);
  return (d.textContent||'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim(); };

var P={
 book:'M12 7v14M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z',

function ico(n,cls,st){ var d=P[n]||P.circle;
  return '<svg class="'+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'+(st?' style="'+st+'"':'')+'><path d="'+d+'"/></svg>'; }

/* ── article types (ported verbatim) ── */
var ARTICLE_TYPES={
 'clinical-cases':{key:'clinical-cases',name:'CLINICAL CASES',
   description:'Brief Report or Clinical Problem Solving. Describes 1–3 patients, one family, or step-by-step clinical reasoning. Maximum words: 2000–2500. Up to 3 tables/figures and 15–25 references.',
   maxWordCount:2500,maxReferences:25,maxFiguresTables:3,
   requiredSections:['Introduction','Case Presentation','Clinical Reasoning','Discussion','Conclusions','Notes on Patient Consent','Acknowledgments','Keywords'],
   abstractType:'unstructured'},
 'original-research':{key:'original-research',name:'ORIGINAL RESEARCH',
   description:'Original Article or Special Article. Reports scientific results of original clinical research, policy, ethics, law, or health care delivery. Maximum words: 2700. Maximum of 5 tables/figures. Up to 40 references.',
   maxWordCount:2700,maxReferences:40,maxFiguresTables:5,
   requiredSections:['Introduction','Materials and Methods','Results','Discussion','Conclusions','Acknowledgments','Keywords'],
   abstractType:'unstructured'},
 'review-articles':{key:'review-articles',name:'REVIEW ARTICLES',
   description:'Clinical Practice Review or Other Review. Evidence-based review for clinical or mechanistic topics. Maximum words: 2500–3000. Up to 5 tables/figures and 50–55 references.',
   maxWordCount:3000,maxReferences:55,maxFiguresTables:5,
   requiredSections:['Introduction','Methods','Evidence Review','Clinical Implications','Discussion','Conclusions','Acknowledgments','Keywords'],
   abstractType:'unstructured'},
 'commentary':{key:'commentary',name:'COMMENTARY',
   description:'Editorial, Perspective, Clinical Implications of Basic Research, or Letter to the Editor. Maximum words: 400–1200 depending on format. Usually no abstract.',
   maxWordCount:1200,maxReferences:10,maxFiguresTables:1,
   requiredSections:['Commentary','Conclusions','Keywords'],
   abstractType:'none'},
 'other':{key:'other',name:'OTHER',
   description:'Special Report, Health Law/Ethics/Human Rights or Health Policy Report, Medicine and Society, or Sounding Board. Maximum words: 2000–2700.',
   maxWordCount:2700,maxReferences:40,maxFiguresTables:5,
   requiredSections:['Introduction','Background','Report','Analysis','Discussion','Conclusions','Acknowledgments','Keywords'],
   abstractType:'unstructured'}
};
var CONTRIB_OPTIONS=[
 'Substantial contributions to concept or design',
 'Acquisition, analysis, or interpretation of data',
 'Drafting of the manuscript',
 'Critical review of the manuscript for important intellectual content',
 'Agreed to be accountable for all aspects of the work',
 'Will review the final version to be published',
 'Supervised the work'];

/* ── manuscript model ── */
function blankManuscript(){
  return {
    id:'GBMN-'+new Date().getFullYear()+'-'+Math.random().toString(36).slice(2,10).toUpperCase(),
    status:'Draft', role:'author', editLog:[], title:'', runningTitle:'', specialty:'', articleType:'original-research',
    publicationInfo:{doi:'',volumeIssue:''}, checklistAgreed:false, checklistAgreedAt:'',
    authors:[], abstractContents:{text:''}, sections:{}, figuresAndTables:[], references:[],
    supplementaryFiles:[], editorFiles:[],
    ethics:{humanSubjectsApproved:'yes',irbApprovalNumber:'',irbInstitution:'',informedConsentObtained:'yes',ethicsStatementFileName:'',ethicsStatementUploadedUrl:''},
    conflictDisclosure:{hasConflict:false,conflictDetails:'',signedCoiFormName:'',signedCoiFormUrl:''},
    fundingDetails:{fundingAgency:'',grantNumber:'',explanation:''},
    preview:{vol:'',iss:'',period:'',year:String(new Date().getFullYear())},
    createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
  };
}
var M = blankManuscript();
var activeStep='getting-started';

/* ── persistence ── */
var KEY='gbmnManuscript';
function save(){ try{ M.updatedAt=new Date().toISOString(); localStorage.setItem(KEY,JSON.stringify(M)); }catch(e){} }
function load(){ try{ var raw=localStorage.getItem(KEY); if(!raw)return;
  var o=JSON.parse(raw); if(!o||typeof o!=='object')return;
  var base=blankManuscript();
  Object.keys(base).forEach(function(k){ if(o[k]===undefined) o[k]=base[k]; });
  ['publicationInfo','ethics','conflictDisclosure','fundingDetails','preview','abstractContents'].forEach(function(k){
    o[k]=Object.assign({}, base[k], o[k]||{}); });
  M=o;
}catch(e){} }
load();

/* ── toast ── */
var toastT;
function notify(msg,type){ var t=$('#toast'); t.className='toast on'+(type==='error'?' err':(type==='info'?' info':''));
  t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(function(){t.className='toast'+(type==='error'?' err':'')},2600); }

/* ── steps (ported verbatim) ── */
var STEPS=[
 {id:'getting-started',label:'Getting Started',icon:'book',title:'1. Complete Manuscript Generation Core',v:function(){return 'complete'}},
 {id:'policies',label:'Journal Policies',icon:'shield',title:'2. GBMN Ethics & Open Access Declarations',v:function(){return 'complete'}},
 {id:'checklist',label:'Manuscript Checklist',icon:'filecheck',title:'3. Mandatory Peer Submitting Checklist',v:function(m){return m.checklistAgreed?'complete':'warning'}},
 {id:'title-meta',label:'Title & Metadata',icon:'file',title:'4. Title and Clinical Specialty Scope',
   v:function(m){return (m.title.trim()&&m.runningTitle.trim()&&m.specialty.trim())?'complete':(m.title.trim()?'warning':'empty')}},
 {id:'authors',label:'Authors',icon:'users',title:'5. GBMN Author Roster Management',
   v:function(m){ if(!m.authors.length) return 'empty';
     var hasCorr=m.authors.some(function(a){return a.isCorresponding});
     var allOrcid=m.authors.every(function(a){return a.orcidId&&a.orcidId.length>5});
     return (hasCorr&&allOrcid)?'complete':'warning'; }},
 {id:'article-type',label:'Article Type',icon:'layers',title:'6. Article Type Quota Configuration',
   v:function(m){return m.articleType?'complete':'empty'}},
 {id:'abstract',label:'Abstract',icon:'spark',title:'7. Structured abstract compilation',
   v:function(m){ var c=ARTICLE_TYPES[m.articleType]; if(!c||c.abstractType==='none')return 'complete';
     var t=stripTags(m.abstractContents.text||''); return t.length>50?'complete':(t.length>0?'warning':'empty'); }},
 {id:'keywords',label:'Keywords',icon:'key',title:'8. Indexed indexing Keywords',
   v:function(m){ var n=(m.sections['Keywords']||'').split(/[;,]/).map(function(k){return k.trim()}).filter(Boolean).length;
     return (n>=3&&n<=6)?'complete':(n>0?'warning':'empty'); }},
 {id:'sections',label:'Manuscript Sections',icon:'file',title:'9. Structured Manuscript Body Segments',
   v:function(m){ var c=ARTICLE_TYPES[m.articleType]; if(!c)return 'empty';
     var reqs=c.requiredSections.filter(function(s){return s!=='Acknowledgments'&&s!=='Keywords'});
     var filled=reqs.filter(function(s){return m.sections[s]&&m.sections[s].length>100});
     return filled.length===reqs.length?'complete':(filled.length?'warning':'empty'); }},
 {id:'references',label:'References (AMA)',icon:'bookmark',title:'10. AMA Bibliography Reference Library',
   v:function(m){ if(!m.references.length)return 'empty';
     return m.references.some(function(r){return !r.authors||!r.title||!r.year||!r.journalOrBook})?'warning':'complete'; }},
 {id:'supplementary',label:'Supplementary Files',icon:'clip',title:'11. Optional Appendix Datasets & Protocols',v:function(){return 'complete'}},
 {id:'ethics',label:'Ethics Statement',icon:'heart',title:'12. Institutional Review Board (IRB) Clearance',
   v:function(m){ var c=m.ethics.humanSubjectsApproved&&m.ethics.informedConsentObtained;
     if(c&&(m.ethics.informedConsentObtained==='no'||m.ethics.humanSubjectsApproved==='not-applicable'||m.ethics.ethicsStatementFileName))return 'complete';
     return c?'warning':'empty'; }},
 {id:'conflicts',label:'Conflict Disclosures',icon:'shield',title:'13. Disclosure of Financial Conflicts (COI)',
   v:function(m){ return (!m.conflictDisclosure.hasConflict||m.conflictDisclosure.signedCoiFormName)?'complete':'warning'; }},
 {id:'funding',label:'Funding Info',icon:'dollar',title:'14. Rustaveli & Global Research Grants',v:function(){return 'complete'}},
 {id:'editor-files',label:'Files for Editorial Office',icon:'filecheck',title:'15. Cover Letter & Referee Guidelines',v:function(){return 'complete'}},
 {id:'preview',label:'Manuscript Preview',icon:'eye',title:'16. Pre-Publication Live Watermarked proof',v:function(){return 'complete'}},
 {id:'summary-submit',label:'Summary & Submit',icon:'check',title:'17. Final Integrity Evaluation & Submitting',v:function(){return 'complete'}}
];
var STEP_HELP={
 checklist:'Checklist must be accepted before submission.',
 'title-meta':'Full title, running title, and specialty are required.',
 authors:'Add at least one author, ORCID, and a corresponding author.',
 abstract:'Abstract is required for this article type.',
 keywords:'Enter 3-6 MeSH-style keywords separated by semicolons.',
 sections:'Required manuscript body sections need content.',
 references:'Add complete AMA references.',
 ethics:'Ethics fields and IRB upload should be completed.',
 conflicts:'COI file is required only when conflicts are declared.'
};

/* ── sidebar ── */
function renderSidebar(){
  var rs=$('#roleSel'); if(rs && rs.value!==M.role) rs.value=M.role;
  var tools=$('#roleTools');
  if(M.role==='author'){ tools.innerHTML=''; }
  else {
    var n=(M.editLog||[]).length;
    tools.innerHTML='<button type="button" class="btn sm" id="edOpen">Open a submission file</button>'+
      '<button type="button" class="btn sm" id="edSave">Save submission file</button>'+
      '<input type="file" id="edFile" accept="application/json,.json" hidden>'+
      '<div class="hint">Full editorial access: every step is open and the proof on the right can be corrected directly — click any paragraph, heading or caption and type.'+
      (n?' '+n+' edit'+(n===1?'':'s')+' recorded.':'')+'</div>';
    $('#edOpen').onclick=function(){ $('#edFile').click(); };
    $('#edSave').onclick=function(){ exportJson(); };
    $('#edFile').onchange=function(e){ var f=e.target.files[0]; if(!f)return;
      var r=new FileReader();
      r.onload=function(){ try{
          var o=JSON.parse(String(r.result)); if(!o||typeof o!=='object') throw 0;
          var base=blankManuscript(), role=M.role;
          Object.keys(base).forEach(function(k){ if(o[k]===undefined) o[k]=base[k]; });
          ['publicationInfo','ethics','conflictDisclosure','fundingDetails','preview','abstractContents']
            .forEach(function(k){ o[k]=Object.assign({},base[k],o[k]||{}); });
          M=o; M.role=role; activeSection=''; activeStep='title-meta';
          notify('Submission opened for editing.','success'); save(); renderAll();
        }catch(err){ notify('That file is not a GBMN submission export.','error'); } };
      r.readAsText(f); };
  }
  $('#sideTitle').textContent = M.title || 'Untitled Manuscript Draft';
  $('#sideStatus').textContent = 'Manuscript Status: '+M.status;
  var nav=$('#sideNav'), html='';
  STEPS.forEach(function(s){
    var st=s.v(M), on=activeStep===s.id;
    var stIcon = st==='complete' ? ico('check','st',on?'color:#99f6e4':'color:#16a34a')
               : st==='warning'  ? ico('alert','st',on?'color:#fde68a':'color:#f59e0b')
               :                   ico('circle','st',on?'color:#5eead4;opacity:.6':'color:#cbd5e1');
    html+='<button type="button" class="stp'+(on?' on':'')+'" data-step="'+s.id+'">'+
          '<span class="lt">'+ico(s.icon,'ic',on?'color:#fff':'color:#94a3b8')+'<span class="lb">'+esc(s.label)+'</span></span>'+stIcon+'</button>';
    if(on && st!=='complete' && STEP_HELP[s.id]) html+='<div class="sthelp">'+esc(STEP_HELP[s.id])+'</div>';
  });
  nav.innerHTML=html;
  var done=STEPS.filter(function(s){return s.v(M)==='complete'}).length;
  var pct=Math.round(done/STEPS.length*100);
  $('#progPct').textContent=pct+'%'; $('#progBar').style.width=pct+'%';
}
$('#roleSel').addEventListener('change',function(e){
  M.role=e.target.value; save();
  notify(M.role==='author'?'Author view.':'Editorial access on — you can correct the proof directly.','success');
  renderAll(); });
$('#sideNav').addEventListener('click',function(e){
  var b=e.target.closest('button[data-step]'); if(!b)return;
  go(b.dataset.step);
});
function go(id){ activeStep=id; renderAll(); $('#midPane').scrollTop=0; }
