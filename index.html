<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBMN Manuscript Submission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
:root{
  --teal:#0f766e; --teal-d:#115e59; --teal-900:#134e4a; --teal-50:#f0fdfa; --teal-100:#ccfbf1; --teal-200:#99f6e4; --teal-300:#5eead4;
  --s50:#f8fafc; --s100:#f1f5f9; --s200:#e2e8f0; --s300:#cbd5e1; --s400:#94a3b8; --s500:#64748b; --s600:#475569; --s700:#334155; --s800:#1e293b;
  --amber50:#fffbeb; --amber200:#fde68a; --amber700:#b45309; --amber900:#78350f;
  --rose50:#fff1f2; --rose200:#fecdd3; --rose700:#be123c;
  --em50:#ecfdf5; --em200:#a7f3d0; --em700:#047857; --em900:#064e3b;
  --ui:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --doc:'Carlito',Calibri,'Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --cond:'Bahnschrift','DIN Alternate','Archivo Narrow','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--ui);color:var(--s800);background:#eef1f4;font-size:13px;line-height:1.5;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,h5{margin:0;font-weight:700}
p{margin:0}

/* ── three independent scroll panes ── */
.app{height:100%;display:grid;grid-template-columns:286px minmax(0,1fr) minmax(0,1fr);}
.pane{min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.side{background:#fff;border-right:1px solid var(--s200);padding:16px 14px 40px}
.mid{background:#eef1f4;padding:16px 18px 60px}
.prev{background:#9ea7ad;padding:0}
@media (max-width:1280px){.app{grid-template-columns:250px minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:1040px){
  body{overflow:auto}
  .app{display:block;height:auto}
  .pane{overflow:visible;height:auto}
  .side{border-right:0;border-bottom:1px solid var(--s200)}
}

/* ── brand ── */
.brand{display:flex;gap:10px;align-items:center;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--s100)}
.brand img{height:30px;width:auto}
.brand b{display:block;font-size:12px;line-height:1.25}
.brand span{font-size:10px;color:var(--s400)}

/* ── sidebar ── */
.sidehead{border-bottom:1px solid var(--s100);padding-bottom:12px;margin-bottom:12px}
.sidehead h3{font-size:10px;text-transform:uppercase;color:var(--s400);letter-spacing:.08em}
.sidehead .t{font-size:12.5px;font-weight:600;color:var(--teal-d);margin-top:4px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sidehead .badge{display:inline-flex;margin-top:5px;padding:1px 6px;border-radius:2px;font-size:9.5px;font-weight:700;
  background:var(--amber50);color:var(--amber900);border:1px solid var(--amber200)}
.stp{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border:0;border-radius:8px;
  background:transparent;text-align:left;font-size:11.5px;font-weight:500;color:var(--s600);cursor:pointer;transition:background .12s}
.stp:hover{background:var(--s50);color:var(--s800)}
.stp.on{background:var(--teal);color:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.stp .lt{display:flex;align-items:center;gap:9px;min-width:0}
.stp .ic{width:15px;height:15px;flex:0 0 15px;opacity:.85}
.stp .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stp .st{width:15px;height:15px;flex:0 0 15px}
.sthelp{padding:2px 11px 7px;font-size:10px;line-height:1.35;color:var(--amber700)}
.prog{margin-top:18px;padding-top:14px;border-top:1px solid var(--s100)}
.prog .pl{display:flex;justify-content:space-between;font-size:10.5px;font-weight:600;color:var(--s500);margin-bottom:5px}
.prog .tr{height:8px;border-radius:99px;background:var(--s100);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--teal);transition:width .4s}
.prog .fn{font-size:10px;color:var(--s400);font-style:italic;margin-top:7px}

/* ── form panel ── */
.panel{background:#fff;border:1px solid var(--s200);border-radius:16px;padding:20px 22px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.phead{border-bottom:1px solid var(--s100);padding-bottom:14px;margin-bottom:18px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.phead .k{font-size:10px;text-transform:uppercase;font-weight:700;color:var(--teal);letter-spacing:.07em}
.phead h2{font-size:18px;color:var(--s800);margin-top:2px}
.stepbody>*+*{margin-top:16px}
.lbl{display:block;font-weight:700;color:var(--s700);font-size:11.5px;margin-bottom:4px}
.lbl .req{color:#dc2626}
.inp,.sel,.ta{width:100%;background:var(--s50);border:1px solid var(--s300);border-radius:8px;padding:8px 10px;font-size:12.5px}
.inp.sm,.sel.sm{padding:6px 8px;border-radius:6px}
.ta{resize:vertical;min-height:72px;line-height:1.5}
.inp:focus,.sel:focus,.ta:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.inp.mono{font-family:var(--mono);color:var(--teal-d);background:var(--s100)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.span2{grid-column:span 2}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}.span2{grid-column:auto}}
.box{background:var(--s50);border:1px solid var(--s200);border-radius:12px;padding:14px}
.boxw{background:#fff;border:1px solid var(--s200);border-radius:12px;padding:16px}
.box>*+*,.boxw>*+*{margin-top:10px}
.note{font-size:11px;color:var(--s500)}
.ital{font-style:italic;color:var(--s400);font-size:11px}
.btn{border:1px solid var(--s300);background:#fff;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;color:var(--s700)}
.btn:hover{background:var(--s50)}
.btn.t{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.t:hover{background:var(--teal-d)}
.btn.tl{background:var(--teal-50);border-color:var(--teal-200);color:var(--teal-d)}
.btn.sm{padding:4px 9px;font-size:10.5px;border-radius:6px}
.btn.rd{color:var(--rose700);border-color:var(--rose200);background:var(--rose50)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.45;cursor:pointer}
.chk input{margin-top:2px;accent-color:var(--teal);width:15px;height:15px;flex:0 0 15px}
.radio{display:inline-flex;gap:6px;align-items:center;font-weight:700;cursor:pointer;font-size:12px}
.radio input{accent-color:var(--teal)}
.tile{display:block;width:100%;text-align:left;border:2px solid var(--s200);background:var(--s50);border-radius:12px;padding:14px;cursor:pointer}
.tile:hover{border-color:var(--s300);background:#fff}
.tile.on{border-color:var(--teal);background:var(--teal-50);box-shadow:0 2px 6px rgba(0,0,0,.07)}
.tile b{font-size:12.5px;color:var(--s800)}
.tile p{font-size:10.5px;color:var(--s500);margin-top:5px;line-height:1.35}
.tile .m{border-top:1px solid var(--s200);margin-top:10px;padding-top:8px;display:flex;justify-content:space-between;font-size:9.5px;font-family:var(--mono);color:var(--teal-d)}
.infobox{border-left:4px solid var(--teal);background:var(--teal-50);border-radius:0 8px 8px 0;padding:12px 14px}
.infobox h4{font-size:12.5px;color:var(--teal-900)}
.infobox p{font-size:11px;color:var(--teal-d);margin-top:4px;line-height:1.5}
.drop{border:2px dashed var(--s300);background:#fff;border-radius:8px;padding:18px;text-align:center}
.drop b{display:block;color:var(--s700);font-size:12px;margin-bottom:5px}
.pill{display:inline-block;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:700;background:var(--teal-50);color:var(--teal)}
.rowcard{background:#fff;border:1px solid var(--s200);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.rowcard+.rowcard{margin-top:8px}
.rowcard .nm{font-weight:700;color:var(--s800);font-size:12px}
.rowcard .af{color:var(--s500);font-size:10px;margin-top:2px}
.rowcard .or{color:#4d7c0f;font-family:var(--mono);font-size:9.5px;margin-top:1px}
.iconbtn{border:1px solid var(--s200);background:var(--s50);border-radius:6px;padding:4px 6px;cursor:pointer;line-height:0}
.iconbtn:disabled{opacity:.4;cursor:not-allowed}
.iconbtn svg{width:13px;height:13px}
.tagbtn{padding:3px 8px;border-radius:6px;background:#fff;border:1px solid var(--s200);font-size:10px;cursor:pointer}
.reflist{list-style:decimal;padding-left:20px;max-height:200px;overflow-y:auto;margin:0}
.reflist li{font-size:11px;color:var(--s700);margin-bottom:7px;line-height:1.45}
.reflist .lk{color:var(--teal);font-weight:700;margin-left:7px;cursor:pointer;background:0;border:0;padding:0;font-size:10.5px}
.reflist .lk:disabled{color:var(--s300);cursor:not-allowed}
.reflist .lk.rd{color:var(--rose700)}
.navbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:16px;margin-top:18px;border-top:1px solid var(--s100)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:90;padding:9px 16px;border-radius:9px;font-size:12px;font-weight:600;
  box-shadow:0 6px 24px rgba(0,0,0,.2);color:#fff;background:var(--teal);opacity:0;pointer-events:none;transition:opacity .2s,bottom .2s}
.toast.on{opacity:1;bottom:30px}
.toast.err{background:#be123c}.toast.info{background:var(--s700)}
.secbtn{text-align:left;border:1px solid var(--s200);background:rgba(255,255,255,.7);border-radius:8px;padding:8px 11px;cursor:pointer;width:100%}
.secbtn.on{border-color:var(--teal);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.secbtn .n{display:block;font-size:9.5px;text-transform:uppercase;font-weight:700;color:var(--s400)}
.secbtn .t{display:block;font-weight:700;font-size:11.5px;color:var(--s700);margin-top:1px}
.secbtn .s{display:block;font-size:9.5px;margin-top:3px}
.secbtn .s.ok{color:var(--em700)}.secbtn .s.no{color:var(--amber700)}
.chklist{display:grid;gap:7px}
.chkopt{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--s200);border-radius:8px;background:#fff;cursor:pointer;font-size:11px}
.chkopt.on{background:var(--teal-50);border-color:var(--teal-300);color:var(--teal-900)}
.chkopt input{accent-color:var(--teal)}

/* ── rich text editor ── */
.rte{display:flex;flex-direction:column;gap:6px}
.rte>.cap{font-weight:700;color:var(--s800);font-size:11.5px}
.rte>.hint{font-size:10px;color:var(--s500);font-style:italic}
.rtbar{display:flex;flex-wrap:wrap;gap:4px;background:var(--s100);border:1px solid var(--s300);border-bottom:0;border-radius:8px 8px 0 0;padding:6px}
.rtbar select{height:28px;border:1px solid var(--s300);background:#fff;padding:0 6px;font-size:11px;font-weight:600}
.rtbar button{height:28px;min-width:28px;border:1px solid var(--s300);background:#fff;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.rtbar button:hover{background:var(--s50);border-color:var(--teal)}
.rtbar svg{width:14px;height:14px}
.rtbar .div{width:1px;background:var(--s300);margin:0 2px}
.rtsel{display:flex;flex-wrap:wrap;gap:7px;align-items:center;border:1px solid var(--teal-200);border-bottom:0;background:var(--teal-50);padding:7px 11px;font-size:10.5px}
.rtsel b{color:var(--teal-900)}
.rtarea{width:100%;background:#fff;border:1px solid var(--s300);border-radius:0 0 8px 8px;padding:12px;font-family:var(--doc);font-size:14px;line-height:1.65;color:var(--s800);min-height:320px;max-height:58vh;overflow-y:auto}
.rtarea:focus{outline:0;box-shadow:0 0 0 1px var(--teal)}
.rtarea:empty:before{content:attr(data-ph);color:#9ca3af}
.rtarea ul{list-style:disc;padding-left:1.5em}
.rtarea ol{list-style:decimal;padding-left:1.5em}
.rtarea h3{font-size:15px;font-weight:700;margin:10px 0 4px}
.rtwc{font-size:10px;color:var(--s400);font-family:var(--mono);font-style:italic}
.gbmn-inline-media{break-inside:avoid;margin:12px 0;border:1px solid var(--s300);padding:8px;background:#fff;cursor:move;position:relative}
.gbmn-inline-media.sel{outline:2px solid var(--teal);outline-offset:2px}
.gbmn-inline-media img{display:block;max-width:100%;height:auto;margin:0 auto}
.gbmn-inline-media figcaption{margin-top:6px;font-family:Arial,sans-serif;font-size:11px;color:var(--s600)}
.gbmn-inline-table{width:100%;table-layout:fixed;border-collapse:collapse;font-family:Arial,sans-serif;font-size:11px}
.gbmn-inline-table th,.gbmn-inline-table td{border:1px solid var(--s300);padding:4px 6px;overflow-wrap:anywhere;vertical-align:top}
.gbmn-inline-table th{background:var(--s100);font-weight:700}
.gbmn-inline-media-diagram pre{white-space:pre-wrap;font-family:var(--mono);font-size:11px;background:var(--s50);padding:8px}
.gbmn-media-actions{position:absolute;top:4px;right:4px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.gbmn-inline-media:hover .gbmn-media-actions,.gbmn-inline-media.sel .gbmn-media-actions{opacity:1}
.gbmn-media-actions button{border:1px solid var(--s300);background:#fff;border-radius:4px;font-size:10px;font-weight:700;padding:2px 6px;cursor:pointer;color:var(--s700)}
.gbmn-media-actions button[data-media-action=delete]{color:#b91c1c}

/* ── modal ── */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,.3);padding:16px}
.modal .sheet{background:#fff;width:100%;max-width:760px;max-height:calc(100vh - 48px);overflow-y:auto;border:1px solid var(--s300);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--s200)}
.modal .mh h3{font-size:19px;font-weight:400;color:#0f172a}
.modal .mh p{font-size:12.5px;color:var(--s600);margin-top:4px}
.modal .mb{padding:18px 20px}
.modal .mb>*+*{margin-top:14px}
.modal .mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--s200);background:var(--s50)}
.modal .x{border:0;background:0;cursor:pointer;font-size:22px;line-height:1;color:var(--s500);padding:0 2px}
.modal input[type=text],.modal textarea,.modal select{width:100%;border:1px solid var(--s300);padding:8px 11px;font-size:12.5px;background:#fff;border-radius:0}
.modal textarea{resize:vertical}
.modal .btn-ins{padding:8px 18px;font-size:12.5px;font-weight:600;border:0;border-radius:6px;background:#7dd3fc;color:#fff;cursor:pointer}
.modal .btn-ins:disabled{opacity:.5;cursor:not-allowed}
.modal .btn-c{padding:8px 18px;font-size:12.5px;font-weight:600;border:1px solid var(--s300);border-radius:6px;background:#fff;color:var(--s600);cursor:pointer}

/* ── preview chrome ── */
.prevbar{position:sticky;top:0;z-index:3;background:#787f85;color:#fff;display:flex;gap:9px;align-items:center;padding:8px 13px;font-size:11.5px;flex-wrap:wrap}
.prevbar .tgl{display:flex;gap:2px;background:rgba(0,0,0,.18);border-radius:999px;padding:2px}
.prevbar .tgl button{border:0;background:transparent;color:#e9edef;border-radius:999px;padding:4px 12px;font-size:11.5px;cursor:pointer}
.prevbar .tgl button[aria-selected=true]{background:#fff;color:#20262b;font-weight:600}
.prevbar input{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:5px;padding:3px 7px;font-size:11px;width:74px}
.prevbar input::placeholder{color:rgba(255,255,255,.6)}
.prevbar .note{opacity:.85;margin-left:auto}
.prevbar .pbtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer}
.prevbar .pbtn:hover{background:rgba(255,255,255,.22)}
.prevwrap{overflow:hidden}
.scroller{width:calc(210mm + 28px);padding:18px 14px 70px;display:flex;flex-direction:column;align-items:center;gap:18px;
  transform-origin:top left;transform:scale(var(--pvs,1))}
@media (max-width:1040px){.scroller{width:100%;transform:none}}

/* ── the document — matched to the printed GBMN layout ───────── */
/* A4 · margins 14mm · body Calibri 11/14.3pt · 2 columns · gap 6mm */
.page{width:210mm;height:297mm;background:#fff;box-shadow:0 2px 18px rgba(0,0,0,.28);font-family:var(--doc);color:#1F2A2A;
  padding:12mm 14mm 9mm;display:flex;flex-direction:column;overflow:hidden}
.page .pbody{flex:1 1 auto;min-height:0;overflow:hidden}
.page .pfront{flex:0 0 auto}
@media (max-width:980px){.page{width:100%;height:auto;padding:16px;box-shadow:0 1px 8px rgba(0,0,0,.22);overflow:visible}
  .page .pbody{overflow:visible}}

/* masthead */
.pmast{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.pmast .mk{display:flex;flex-direction:column}
.pmast img{width:113mm;height:auto;display:block;margin-left:-3.4mm}
.pmast .vol{font-family:var(--cond);font-size:9pt;color:#000;white-space:nowrap;padding-bottom:1.2mm;letter-spacing:.01em}
@media (max-width:980px){.pmast img{width:62%;margin-left:0}.pmast .vol{font-size:9px}}
.prule{border:0;border-top:2.25pt solid #0E7A72;margin:2.2mm 0 0}
.prule2{border:0;border-top:.75pt solid #0E7A72;margin:.75mm 0 5mm}

/* title block */
.ptitle{font-size:19.6pt;line-height:1.2;font-weight:700;color:#006F68;text-align:center;margin:3mm 0 3mm;text-wrap:balance}
.pauth{font-size:12pt;color:#686868;text-align:center;line-height:1.5;margin:0 0 4mm}
.pauth sup{font-size:8pt;font-weight:700;color:#006F68;vertical-align:super}
.paffil{font-size:8.5pt;color:#444c4c;line-height:1.45;margin:0 0 3mm}
.paffil div{text-indent:-3mm;padding-left:3mm}
.paffil sup{font-size:7pt;color:#006F68;font-weight:700}
.pcorr{font-size:8.5pt;color:#444c4c;margin:0 0 3mm}
.pdates{font-size:9pt;color:#444c4c;font-style:italic;margin:0 0 2mm}

/* abstract — full width */
.pabs-h{font-size:11pt;font-weight:700;color:#B9353A;letter-spacing:.02em;margin:0 0 1mm}
.pabs{font-size:10pt;line-height:1.30;text-align:justify;hyphens:auto}
.pabs p{margin:0 0 1.2mm}
.pabs .lb{font-weight:700;color:#006F68}
.pdoi{font-size:11pt;font-weight:700;color:#008080;text-decoration:underline;margin:4mm 0 5mm}

/* body — two columns */
.pbody{font-size:11pt;line-height:1.30;text-align:justify;hyphens:auto;
  column-count:2;column-gap:6mm;column-fill:auto}
.pbody p{margin:0}
.pbody p + p{text-indent:5mm}
.pbody h2{font-size:11pt;font-weight:700;color:#B9353A;letter-spacing:.02em;margin:3.4mm 0 .8mm;break-after:avoid}
.pbody h3{font-size:11pt;font-weight:700;color:#1F2A2A;margin:2.6mm 0 .6mm;break-after:avoid}
.pbody .decl p{margin:0 0 1.2mm;text-indent:0}
.pbody .decl b{color:#006F68}
.pbody ol.refs{font-size:9.5pt;line-height:1.28;padding-left:5mm;margin:0}
.pbody ol.refs li{margin:0 0 .8mm;text-align:left}
.pbody figure.fg{margin:2.5mm 0;break-inside:avoid}
.pbody figure.fg img{width:100%;height:auto;display:block}
.pbody figure.fg figcaption{font-size:8.5pt;line-height:1.35;margin-top:1.2mm;text-align:left}
.pbody figure.fg figcaption b{color:#006F68}
.pbody .tbl{margin:2.5mm 0;break-inside:avoid}
.pbody .tbl .cap{font-size:8.5pt;margin-bottom:1mm;text-align:left}
.pbody .tbl .cap b{color:#006F68}
.pbody .tbl table{width:100%;border-collapse:collapse;font-size:8.5pt}
.pbody .tbl th,.pbody .tbl td{border-top:.7px solid #9aa5a5;border-bottom:.7px solid #9aa5a5;padding:1mm 1.4mm;text-align:left;vertical-align:top}
.pbody .tbl thead th{background:#E6F0EE;font-weight:700;color:#14201e}


/* inline media coming from the rich-text editor */
.pbody figure.gbmn-inline-media{margin:2.5mm 0;border:0;padding:0;background:0;cursor:auto;break-inside:avoid;position:static}
.pbody figure.gbmn-inline-media .gbmn-media-actions{display:none}
.pbody figure.gbmn-inline-media img{width:100%;height:auto;display:block}
.pbody figure.gbmn-inline-media figcaption{font-family:var(--doc);font-size:8.5pt;line-height:1.35;margin:0 0 1.2mm;color:#1F2A2A;text-align:left}
.pbody figure.gbmn-inline-media figcaption strong{color:#006F68}
.pbody figure.gbmn-inline-media table,.pbody table.gbmn-inline-table{width:100%;border-collapse:collapse;font-family:var(--doc);font-size:8.5pt;table-layout:fixed}
.pbody figure.gbmn-inline-media th,.pbody figure.gbmn-inline-media td{border-top:.7px solid #9aa5a5;border-bottom:.7px solid #9aa5a5;border-left:0;border-right:0;padding:1mm 1.4mm;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.pbody figure.gbmn-inline-media th{background:#E6F0EE;font-weight:700;color:#14201e}
.pbody figure.gbmn-inline-media pre{white-space:pre-wrap;font-family:var(--mono);font-size:8.5pt;background:#f4f7f7;padding:1.5mm}
.pbody figure.gbmn-media-one-column{column-span:all;-webkit-column-span:all}
.web .pbody figure.gbmn-inline-media figcaption{font-size:13px;color:#475569}
.web .pbody figure.gbmn-inline-media table{font-size:13px}
.web .pbody figure.gbmn-inline-media th,.web .pbody figure.gbmn-inline-media td{padding:6px 8px}

/* footer */
.pfoot{margin-top:auto;padding-top:3mm;font-family:var(--cond);font-size:8pt;color:#000;text-align:center;line-height:1.35}

/* title page extras */
.tp-meta{margin-top:6mm;border-top:.9px solid #cfd6d6}
.tp-meta div{display:grid;grid-template-columns:46mm 1fr;font-size:9.5pt;border-bottom:.9px solid #e4e9e9}
.tp-meta span.k{padding:1.6mm 2mm;font-weight:700;color:#006F68}
.tp-meta span.v{padding:1.6mm 2mm}
@media (max-width:620px){.tp-meta div{grid-template-columns:1fr}}
.tp-note{margin-top:5mm;font-size:8.5pt;color:#6a7278;line-height:1.45}

/* ── web version ── */
.web{width:min(820px,100%);background:#fff;box-shadow:0 2px 18px rgba(0,0,0,.28);font-family:var(--doc);color:#1F2A2A}
.web .wtop{background:#0f2f2b;color:#eaf2f0;padding:22px 30px}
.web .wtop img{height:42px;filter:brightness(0) invert(1);opacity:.96}
.web .wtop .wv{font-family:var(--cond);font-size:12px;letter-spacing:.1em;opacity:.8;margin-top:10px}
.web .wbody{padding:26px 30px 34px}
@media (max-width:620px){.web .wtop,.web .wbody{padding:18px 16px}}
.web .ptitle{text-align:left;font-size:27px;line-height:1.2}
.web .pauth,.web .paffil,.web .pcorr,.web .pdates{text-align:left}
.web .pabs{font-size:15px;line-height:1.6}
.web .pabs-h,.web .pbody h2{font-size:13px;letter-spacing:.1em}
.web .pdoi{font-size:14px}
.web .pbody{column-count:1;font-size:16px;line-height:1.68}
.web .pbody p + p{text-indent:0;margin-top:12px}
.web .pbody h2{margin:26px 0 8px}
.web .pbody h3{font-size:17px}
.web .pbody ol.refs{font-size:14px;line-height:1.5}
.web .toc{background:#EAF3F1;border-left:3px solid #0E7A72;padding:12px 14px;margin:18px 0;font-size:14px}
.web .toc b{display:block;font-family:var(--cond);font-size:11px;letter-spacing:.12em;color:#006F68;margin-bottom:6px}
.web .toc a{color:#1F2A2A;text-decoration:none;display:block;padding:2px 0}
.web .toc a:hover{color:#006F68;text-decoration:underline}

/* ── print ── */
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff;margin:0;padding:0}
  .side,.mid,.prevbar,.web,.toast,.modal{display:none !important}
  .app{display:block;height:auto}
  .pane{overflow:visible}
  html,body{height:auto;overflow:visible}
  .prev{overflow:visible;background:#fff}
  .prevwrap{overflow:visible;height:auto !important}
  .scroller{width:auto;transform:none;padding:0;gap:0;display:block;align-items:stretch}
  .page{width:210mm;height:297mm;box-shadow:none;break-after:page;page-break-after:always;overflow:hidden}
  .page:last-child{break-after:auto;page-break-after:auto}
  a{color:inherit}
}
</style>
</head>
<body>
<div class="app">

  <aside class="pane side" id="sidePane">
    <div class="brand">
      <img id="brandLogo" alt="GBMN">
      <div><b>Georgian Biomedical and Medical Nexus</b><span>Manuscript submission</span></div>
    </div>
    <div class="sidehead">
      <h3>Submission Workflow</h3>
      <div class="t" id="sideTitle">Untitled Manuscript Draft</div>
      <span class="badge" id="sideStatus">Manuscript Status: Draft</span>
    </div>
    <nav id="sideNav"></nav>
    <div class="prog">
      <div class="pl"><span>Overall Submission Readiness</span><span id="progPct">0%</span></div>
      <div class="tr"><i id="progBar" style="width:0%"></i></div>
      <div class="fn">All sections must show green or amber status before final submittal.</div>
    </div>
  </aside>

  <main class="pane mid" id="midPane">
    <div class="panel">
      <div class="phead">
        <div>
          <span class="k" id="stepKicker">Step Profile</span>
          <h2 id="stepTitle"></h2>
        </div>
        <div id="stepAction"></div>
      </div>
      <div class="stepbody" id="stepBody"></div>
      <div class="navbar">
        <button class="btn" id="btnPrev" type="button">&larr; Save and Back</button>
        <button class="btn tl" id="btnSave" type="button">Save</button>
        <button class="btn t" id="btnNext" type="button">Save and Continue &rarr;</button>
      </div>
    </div>
  </main>

  <section class="pane prev" id="prevPane">
    <div class="prevbar">
      <div class="tgl" id="pvTgl">
        <button type="button" data-pv="print" aria-selected="true">PDF</button>
        <button type="button" data-pv="title" aria-selected="false">Title page</button>
        <button type="button" data-pv="web" aria-selected="false">Web</button>
      </div>
      <input id="pvVol" placeholder="Vol" title="Volume" style="width:48px">
      <input id="pvIss" placeholder="Iss" title="Issue" style="width:48px">
      <input id="pvPeriod" placeholder="JUL–SEP 2026" title="Issue period" style="width:120px">
      <input id="pvDoi" placeholder="DOI" title="DOI" style="width:150px">
      <button class="pbtn" id="btnPdf" type="button">Download PDF</button>
      <button class="pbtn" id="btnHtml" type="button">HTML</button>
      <span class="note" id="pvNote"></span>
    </div>
    <div class="prevwrap" id="prevWrap"><div class="scroller" id="scroller"></div></div>
  </section>

</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

var KEY='gbmnManuscript';

function load(){ try{ var raw=localStorage.getItem(KEY); if(!raw)return;
  var o=JSON.parse(raw); if(!o||typeof o!=='object')return;
  var base=blankManuscript();
  Object.keys(base).forEach(function(k){ if(o[k]===undefined) o[k]=base[k]; });
  ['publicationInfo','ethics','conflictDisclosure','fundingDetails','preview','abstractContents'].forEach(function(k){
    o[k]=Object.assign({}, base[k], o[k]||{}); });
  M=o;
}catch(e){} }

function escHtml(t){return esc(t)}
function tableFromDelimitedText(text){
  var rows=text.trim().split(/\r?\n/).filter(Boolean).map(function(r){return r.split(/\t|,/).map(function(c){return c.trim()})});
  if(!rows.length) return '';
  return '<table class="gbmn-inline-table"><tbody>'+rows.map(function(row,ri){
    return '<tr>'+row.map(function(c){return ri===0?'<th>'+escHtml(c)+'</th>':'<td>'+escHtml(c)+'</td>'}).join('')+'</tr>';
  }).join('')+'</tbody></table>';
}
function mediaActionsHtml(){
  return '<div class="gbmn-media-actions" contenteditable="false">'+
    '<button type="button" data-media-action="edit">Edit</button>'+
    '<button type="button" data-media-action="delete">Delete</button></div>';
}
function sanitizeRichPaste(html){
  var d=document.createElement('div'); d.innerHTML=html;
  d.querySelectorAll('script,style,meta,link').forEach(function(n){n.remove()});
  d.querySelectorAll('*').forEach(function(n){
    Array.prototype.slice.call(n.attributes).forEach(function(a){
      if(/^on/i.test(a.name)) n.removeAttribute(a.name);
      if(a.name==='class'&&!/gbmn-/.test(a.value)) n.removeAttribute('class');
      if(a.name==='style') n.removeAttribute('style');
    });
    if(n.tagName==='TABLE') n.className='gbmn-inline-table';
  });
  return d.innerHTML;
}

function touch(){ save(); renderSidebar(); renderPreview(); }
function restep(){ save(); renderAll(); }
function cfg(){ return ARTICLE_TYPES[M.articleType]; }
function sectionNames(){ return (cfg()?cfg().requiredSections:[]).filter(function(s){return s!=='Keywords'}); }
function normalizeKeywords(v){ var k=v.split(/[;,]/).map(function(x){return x.trim()}).filter(Boolean); return k.length? k.join('; ')+'.' : ''; }
function fileSizeLabel(f){ return f.size<1048576 ? Math.max(1,Math.round(f.size/1024))+' KB' : (f.size/1048576).toFixed(1)+' MB'; }
function readDataUrl(f){ return new Promise(function(res){ var r=new FileReader(); r.onload=function(){res(String(r.result||''))}; r.readAsDataURL(f); }); }
function formatAMAReference(ref){
  if(!ref.authors||!ref.title||!ref.journalOrBook||!ref.year) return 'Incomplete citation data provided';
  var a=ref.authors.trim(); if(a.slice(-1)!=='.') a+='.';
  var t=ref.title.trim(), vol=ref.volume?String(ref.volume).trim():'', iss=ref.issue?'('+ref.issue+')':'',
      pg=ref.pages?':'+ref.pages:'', sfx=ref.doi?' doi:'+ref.doi:(ref.url?' Available at: '+ref.url:'');
  if(ref.type==='journal') return a+' '+t+'. *'+ref.journalOrBook+'*. '+ref.year+';'+vol+iss+pg+'.'+sfx;
  if(ref.type==='book') return a+' *'+ref.journalOrBook+'*. '+ref.year+(vol?', Vol '+vol:'')+(ref.pages?', p. '+ref.pages:'')+'.'+sfx;
  return a+' '+t+'. *'+ref.journalOrBook+'*. Published '+ref.year+'.'+sfx;
}

function orcidLookup(){
  var clean=(AF.orcid||'').replace(/^https?:\/\/orcid\.org\//i,'').trim();
  if(!clean) return;
  AF.busy=true; renderStep();
  fetch('https://pub.orcid.org/v3.0/'+clean+'/record',{headers:{Accept:'application/json'}})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(rec){
      var nm=rec&&rec.person&&rec.person.name||{};
      var given=(nm['given-names']||{}).value||'', family=(nm['family-name']||{}).value||'';
      var emails=((rec.person||{}).emails||{}).email||[];
      var grp=((rec['activities-summary']||{}).employments||{})['affiliation-group']||[];
      var org=grp[0]&&grp[0].summaries&&grp[0].summaries[0]&&grp[0].summaries[0]['employment-summary']&&grp[0].summaries[0]['employment-summary'].organization;
      if(given&&!AF.first)AF.first=given; if(family&&!AF.last)AF.last=family;
      if(emails[0]&&emails[0].email&&!AF.email)AF.email=emails[0].email;
      if(org&&org.name){ if(!AF.inst)AF.inst=org.name;
        if(org.address){ if(!AF.city&&org.address.city)AF.city=org.address.city; if(!AF.country&&org.address.country)AF.country=org.address.country; }
        var full=[AF.dept,org.name,org.address&&org.address.city,org.address&&org.address.country].filter(Boolean).join(', ');
        if(full&&AF.affiliations.indexOf(full)<0) AF.affiliations.push(full); }
      AF.orcid=clean; AF.busy=false; renderStep();
      notify('ORCID author metadata imported where available.','success'); })
    .catch(function(){ AF.busy=false; renderStep();
      notify('ORCID metadata could not be imported. You can complete author fields manually.','error'); });
}
function addAuthor(e){
  e.preventDefault();
  var affs = AF.affiliations.length ? AF.affiliations.slice()
           : [AF.affil || [AF.dept,AF.inst,AF.city,AF.country].filter(Boolean).join(', ')].filter(Boolean);
  if(!AF.first||!AF.last||!AF.orcid||(!AF.inst&&!affs.length)){
    notify('First name, Last Name, Affiliation, and Mandated ORCID iD are required.','error'); return; }
  var core=AF.tags.some(function(t){return ['Substantial contributions to concept or design','Acquisition, analysis, or interpretation of data'].indexOf(t)>=0});
  var writ=AF.tags.some(function(t){return ['Drafting of the manuscript','Critical review of the manuscript for important intellectual content'].indexOf(t)>=0});
  var req=['Agreed to be accountable for all aspects of the work','Will review the final version to be published'].every(function(t){return AF.tags.indexOf(t)>=0});
  if(!core||!writ||!req){ notify('Each author must have concept/data, writing/review, accountability, and final review contributions checked.','error'); return; }
  var a={ id:AF.editingId||nid('auth'), firstName:AF.first, middleInitial:AF.middle||undefined, lastName:AF.last,
    email:AF.email, phone:AF.phone, orcidId:AF.orcid, specialty:AF.spec, country:AF.country, city:AF.city,
    institution:AF.inst, department:AF.dept, affiliation:affs[0], affiliations:affs, academicTitle:AF.title,
    contributionRole:AF.contrib||AF.tags.join('; '), contributionTags:AF.tags.slice(), isCorresponding:AF.corr };
  var list = AF.editingId ? M.authors.filter(function(x){return x.id!==AF.editingId}) : M.authors.slice();
  if(AF.corr) list=list.map(function(x){ x.isCorresponding=false; return x; });
  if(AF.editingId){ var idx=M.authors.map(function(x){return x.id}).indexOf(AF.editingId);
    list.splice(idx>=0?Math.min(idx,list.length):list.length,0,a); } else list.push(a);
  M.authors=list;
  notify('Author '+AF.first+' '+AF.last+' successfully '+(AF.editingId?'updated':'added')+'!','success');
  resetAF(); restep();
}

  $$('[data-rup]',b).forEach(function(el){ el.addEventListener('click',function(){ var i=+el.dataset.rup, l=M.references.slice();
    var t=l[i-1]; l[i-1]=l[i]; l[i]=t; M.references=l; restep(); }); });
  $$('[data-rdn]',b).forEach(function(el){ el.addEventListener('click',function(){ var i=+el.dataset.rdn, l=M.references.slice();
    var t=l[i+1]; l[i+1]=l[i]; l[i]=t; M.references=l; restep(); }); });
  $$('[data-rdel]',b).forEach(function(el){ el.addEventListener('click',function(){

    notify('Looking up DOI metadata...','info');
    fetch('https://api.crossref.org/works/'+encodeURIComponent(d)).then(function(r){return r.json()}).then(function(data){
      var w=data.message||{};
      var auth=(w.author||[]).map(function(a){ return (a.family||'')+' '+String(a.given||'').split(' ').map(function(n){return n[0]||''}).join(''); }).join(', ');

      restep();

  });

    M.references.push({id:nid('ref'),type:CF.type,authors:CF.authors,title:CF.title,journalOrBook:CF.src,year:CF.year,
      volume:CF.volume||undefined,issue:CF.issue||undefined,pages:CF.pages||undefined,doi:CF.doi||undefined,url:CF.url||undefined});
    notify('AMA Reference indexed successfully!','success');
    CF={type:'journal',authors:'',title:'',src:'',year:'',volume:'',issue:'',pages:'',doi:'',url:''};
    restep(); });
};

     '<div class="g2" style="gap:10px;font-size:11.5px">'+
       line(!!M.title.trim(),'Paper Title completed')+
       line(M.authors.length>0,'Authors affil roster linked')+
       line(M.authors.some(function(a){return a.isCorresponding}),'Corresponding author selected')+
       line(M.references.length>0,'AMA references bibliographic data filled')+
       line(!!M.ethics.humanSubjectsApproved,'IRB statement of subjects disclosure')+
     '</div></div>'+
   '<div id="sumIssues" class="box"></div>'+
   '<div style="text-align:center;padding-top:6px">'+
     '<div style="display:flex;flex-direction:column;align-items:center;gap:10px">'+
       '<button type="button" id="btnSubmit" class="btn t" style="padding:14px 30px;border-radius:12px;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;background:var(--teal-900);border-color:var(--teal-900)">Save &amp; Submit to Editorial Office</button>'+
       '<button type="button" id="btnDraft" class="btn" style="padding:8px 22px;border-radius:12px">Save as Draft</button>'+
     '</div>'+
     '<p style="font-size:10px;color:var(--s400);margin-top:6px">A confirmation notification will be routed to your academic mailbox credentials.</p></div>';
  paintIssues($('#sumIssues'));
  $('#btnSubmit').addEventListener('click',function(){
    if(!M.title.trim()){ notify('Submission error: Full title is missing from metadata.','error'); return; }
    if(!M.authors.length){ notify('Submission error: Minimum of 1 author affiliate matching credentials required.','error'); return; }

    go('getting-started'); });
  $('#btnDraft').addEventListener('click',function(){ save(); notify('Draft saved. You can return to continue editing.','success'); });
};

/* ══ document builders — printed GBMN layout ═══════════════════ */
function ital(s){ return esc(s).replace(/\*([^*]+)\*/g,'<i>$1</i>'); }
function affilList(){
  var out=[]; M.authors.forEach(function(a){
    (a.affiliations&&a.affiliations.length?a.affiliations:[a.affiliation]).forEach(function(x){ if(x&&out.indexOf(x)<0) out.push(x); }); });
  return out;
}
function volLine(){
  var p=[], pv=M.preview||{};
  if(pv.vol) p.push('VOLUME '+pv.vol);
  if(pv.iss) p.push('ISSUE '+pv.iss);
  var s=p.join(' ');
  return ((s? s+'.' : '')+(pv.period? ' '+pv.period : '')).toUpperCase().trim();
}
function masthead(){
  return '<div class="pmast"><div class="mk"><img src="'+LOGO+'" alt="Georgian Biomedical and Medical Nexus"></div>'+
    '<div class="vol">'+esc(volLine())+'</div></div><hr class="prule"><hr class="prule2">'; }
function footer(){
  var yr=(M.preview&&M.preview.year)||String(new Date().getFullYear());
  return '<div class="pfoot">Georgian Biomedical and Medical Nexus (Former Georgian Biomedical News)<br>'+
    'ISSN (Online): 2720-8796&nbsp;&nbsp;ISSN (Print): 2720-7994<br>'+
    'Downloaded from gbmn.org. For personal use only. No other uses without permission.<br>'+
    'Copyright &copy; '+esc(yr)+'. All rights reserved.</div>'; }
function authorLine(){
  var affs=affilList();
  return M.authors.map(function(a){
    var nums=(a.affiliations&&a.affiliations.length?a.affiliations:[a.affiliation]).map(function(x){ var i=affs.indexOf(x); return i<0?'':String(i+1); }).filter(Boolean);
    var sup=nums.slice();
    if(a.orcidId) sup.push('ID');
    if(a.isCorresponding) sup.push('*');
    var nm=[a.firstName,a.middleInitial,a.lastName].filter(Boolean).join(' ');
    return esc(nm)+(sup.length?'<sup>'+esc(sup.join(','))+'</sup>':'');
  }).join(', '); }
function affilBlock(){
  var affs=affilList(); if(!affs.length) return '';
  return '<div class="paffil">'+affs.map(function(a,i){return '<div><sup>'+(i+1)+'</sup> '+esc(a)+'</div>'}).join('')+'</div>'; }
function corrLine(){
  var c=M.authors.filter(function(a){return a.isCorresponding})[0]; if(!c) return '';
  var nm=[c.firstName,c.middleInitial,c.lastName].filter(Boolean).join(' ');
  return '<div class="pcorr"><b>*</b> Corresponding author: '+esc(nm)+(c.email?' — '+esc(c.email):'')+'</div>'; }
function doiLine(){ var d=(M.publicationInfo||{}).doi; return d? '<div class="pdoi">DOI. '+esc(d)+'</div>' : ''; }
function absBlock(){
  var txt=(M.abstractContents.text||'').trim(), kw=(M.sections['Keywords']||'').trim();
  var none = cfg()&&cfg().abstractType==='none';
  if((!txt||none) && !kw) return '';
  return (none?'':'<div class="pabs-h">ABSTRACT</div>')+'<div class="pabs">'+
    (none?'':txt)+ (kw? '<p><span class="lb">KEYWORDS.</span> '+esc(kw)+'</p>':'')+'</div>'; }
function sectionsHtml(withIds){
  return sectionNames().map(function(s,i){
    var html=(M.sections[s]||'').trim(); if(!html) return '';
    return '<h2'+(withIds?' id="s'+i+'"':'')+'>'+esc(s).toUpperCase()+'</h2>'+html;
  }).join(''); }
function declRows(){
  var E=M.ethics,C=M.conflictDisclosure,F=M.fundingDetails,rows=[];
  var eth=[];
  if(E.humanSubjectsApproved==='yes') eth.push('Human subjects approval was obtained'+(E.irbInstitution?' from '+E.irbInstitution:'')+(E.irbApprovalNumber?' (approval '+E.irbApprovalNumber+')':'')+'.');
  else if(E.humanSubjectsApproved==='exempt') eth.push('The study was granted exemption by the ethics board'+(E.irbInstitution?' of '+E.irbInstitution:'')+'.');
  else if(E.humanSubjectsApproved==='not-applicable') eth.push('Ethics approval was not applicable to this work.');
  if(E.informedConsentObtained==='yes') eth.push('Written informed consent was obtained from all subjects.');
  else if(E.informedConsentObtained==='not-applicable') eth.push('Informed consent was not applicable.');
  if(eth.length) rows.push(['Ethics approval',eth.join(' ')]);
  rows.push(['Conflict of interest', C.hasConflict ? (C.conflictDetails||'The authors declare conflicts of interest.') : 'The authors declare no conflict of interest.']);
  var fu=[F.fundingAgency,F.grantNumber?'Grant '+F.grantNumber:'',F.explanation].filter(Boolean).join('. ');
  rows.push(['Funding', fu || 'This research received no external funding.']);
  var contrib=M.authors.filter(function(a){return a.contributionRole}).map(function(a){
    var ini=(a.firstName?a.firstName[0]+'.':'')+(a.lastName?a.lastName[0]+'.':'');
    return ini+' '+a.contributionRole; }).join('; ');
  if(contrib) rows.push(['Author contributions',contrib]);
  return rows; }
function declHtml(){
  var rows=declRows(); if(!rows.length) return '';
  return '<h2>DECLARATIONS</h2><div class="decl">'+rows.map(function(r){return '<p><b>'+r[0]+'.</b> '+esc(r[1])+'</p>'}).join('')+'</div>'; }
function refsHtml(){
  if(!M.references.length) return '';
  return '<h2>REFERENCES</h2><ol class="refs">'+M.references.map(function(r){return '<li>'+ital(formatAMAReference(r))+'</li>'}).join('')+'</ol>'; }
function frontMatter(){
  return '<h1 class="ptitle">'+esc(M.title||'Untitled manuscript')+'</h1>'+
    '<div class="pauth">'+authorLine()+'</div>'+ absBlock()+ doiLine(); }
function bodyNodes(){
  var holder=document.createElement('div');
  holder.innerHTML = sectionsHtml(false)+declHtml();
  holder.querySelectorAll('.gbmn-media-actions').forEach(function(n){n.remove()});
  holder.querySelectorAll('[contenteditable]').forEach(function(n){n.removeAttribute('contenteditable')});
  var nodes=Array.prototype.slice.call(holder.children);
  if(M.references.length){
    var h=document.createElement('h2'); h.textContent='REFERENCES'; nodes.push(h);
    M.references.forEach(function(r,i){
      var ol=document.createElement('ol'); ol.className='refs'; ol.setAttribute('start',String(i+1));
      var li=document.createElement('li'); li.innerHTML=ital(formatAMAReference(r)); ol.appendChild(li); nodes.push(ol); });
  }
  return nodes; }
function pageShell(first){
  var pg=document.createElement('div'); pg.className='page';
  pg.innerHTML = masthead() + (first? '<div class="pfront">'+frontMatter()+'</div>' : '') + '<div class="pbody"></div>' + footer();
  return pg; }
function wordCount(){ return sectionNames().reduce(function(n,s){ var t=stripTags(M.sections[s]||''); return n+(t?t.split(/\s+/).length:0); },0); }
function titlePage(){
  var orcids=M.authors.filter(function(a){return a.orcidId}).map(function(a){
    return esc([a.firstName,a.lastName].filter(Boolean).join(' '))+' — '+esc(a.orcidId); });
  var media=0; sectionNames().forEach(function(s){ media+=((M.sections[s]||'').match(/gbmn-inline-media /g)||[]).length; });
  return '<div class="page">'+masthead()+
    '<h1 class="ptitle">'+esc(M.title||'Untitled manuscript')+'</h1>'+
    '<div class="pauth">'+authorLine()+'</div>'+affilBlock()+corrLine()+doiLine()+
    '<div class="tp-meta">'+
      '<div><span class="k">Article type</span><span class="v">'+esc(cfg()?cfg().name:'')+'</span></div>'+
      '<div><span class="k">Running title</span><span class="v">'+esc(M.runningTitle)+'</span></div>'+
      '<div><span class="k">Specialty</span><span class="v">'+esc(M.specialty)+'</span></div>'+
      '<div><span class="k">Keywords</span><span class="v">'+esc(M.sections['Keywords']||'')+'</span></div>'+
      '<div><span class="k">Word count (body)</span><span class="v">'+wordCount()+'</span></div>'+
      '<div><span class="k">Figures / Tables</span><span class="v">'+media+'</span></div>'+
      '<div><span class="k">References</span><span class="v">'+M.references.length+'</span></div>'+
      (orcids.length?'<div><span class="k">ORCID</span><span class="v">'+orcids.join('<br>')+'</span></div>':'')+
    '</div>'+
    '<div class="tp-note">This title page is submitted separately from the main manuscript, so that the manuscript can be sent to reviewers without author identifying information.</div>'+
    footer()+'</div>'; }
function webVersion(){
  var toc=sectionNames().filter(function(s){return (M.sections[s]||'').trim()}).map(function(s,i){return '<a href="#s'+i+'">'+esc(s)+'</a>'}).join('');
  var body=sectionsHtml(true)+declHtml()+refsHtml();
  var d=document.createElement('div'); d.innerHTML=body;
  d.querySelectorAll('.gbmn-media-actions').forEach(function(n){n.remove()});
  d.querySelectorAll('[contenteditable]').forEach(function(n){n.removeAttribute('contenteditable')});
  return '<article class="web"><div class="wtop"><img src="'+LOGO+'" alt="GBMN"><div class="wv">'+esc(volLine())+'</div></div>'+
    '<div class="wbody"><h1 class="ptitle">'+esc(M.title||'Untitled manuscript')+'</h1>'+
    '<div class="pauth">'+authorLine()+'</div>'+affilBlock()+corrLine()+absBlock()+doiLine()+
    (toc?'<nav class="toc"><b>CONTENTS</b>'+toc+'</nav>':'')+
    '<div class="pbody">'+d.innerHTML+'</div></div></article>'; }

/* ══ validation ════════════════════════════════════════════════ */
function validate(){
  var p=[], c=cfg();
  if(!M.title.trim()) p.push('Title is empty.');
  if(!M.runningTitle.trim()) p.push('Running title is empty.');
  if(!M.specialty.trim()) p.push('Primary medical specialty is empty.');
  if(!M.checklistAgreed) p.push('The manuscript integrity checklist has not been accepted.');
  if(!M.authors.length) p.push('No authors have been added.');
  if(M.authors.length && !M.authors.some(function(a){return a.isCorresponding})) p.push('No corresponding author is marked.');
  M.authors.forEach(function(a){ if(!a.orcidId) p.push([a.firstName,a.lastName].filter(Boolean).join(' ')+' has no ORCID iD.'); });
  if(c&&c.abstractType!=='none'){
    var aw=stripTags(M.abstractContents.text||''); aw=aw?aw.split(/\s+/).length:0;
    if(!aw) p.push('Abstract is empty.'); else if(aw>250) p.push('Abstract is '+aw+' words — the limit is 250.'); }
  var kn=(M.sections['Keywords']||'').split(/[;,]/).map(function(x){return x.trim()}).filter(Boolean).length;
  if(!kn) p.push('No keywords entered.'); else if(kn<3||kn>6) p.push(kn+' keywords — 3 to 6 are required.');
  sectionNames().filter(function(s){return s!=='Acknowledgments'}).forEach(function(s){
    if(stripTags(M.sections[s]||'').length<100) p.push('Section "'+s+'" is empty or too short.'); });
  var w=wordCount(); if(c&&w>c.maxWordCount) p.push('Body is '+w+' words — the limit for '+c.name+' is '+c.maxWordCount+'.');
  if(!M.references.length) p.push('Reference list is empty.');
  else { if(c&&M.references.length>c.maxReferences) p.push(M.references.length+' references — the limit for '+c.name+' is '+c.maxReferences+'.');
    M.references.forEach(function(r,i){ if(!r.authors||!r.title||!r.year||!r.journalOrBook) p.push('Reference '+(i+1)+' is incomplete.'); }); }
  var media=0; sectionNames().forEach(function(s){ media+=((M.sections[s]||'').match(/gbmn-inline-media /g)||[]).length; });
  if(c&&media>c.maxFiguresTables) p.push(media+' figures/tables — the limit for '+c.name+' is '+c.maxFiguresTables+'.');
  if(M.conflictDisclosure.hasConflict && !M.conflictDisclosure.signedCoiFormName) p.push('A signed COI form is required when conflicts are declared.');
  return p;
}
function paintIssues(box){
  box=box||$('#pvIssues'); if(!box) return;
  var p=validate();
  if(!p.length){ box.innerHTML='<b style="color:var(--em700)">No issues</b><div class="note" style="margin-top:4px">The manuscript is ready to submit.</div>'; return; }
  box.innerHTML='<b style="color:var(--amber700)">'+p.length+(p.length===1?' item to fix':' items to fix')+'</b>'+
    '<ul style="margin:6px 0 0;padding-left:18px;font-size:11.5px;line-height:1.6;color:var(--s600)">'+
    p.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
}

/* ══ pagination ════════════════════════════════════════════════ */
function fitsIn(box){ return box.scrollWidth <= box.clientWidth + 1 && box.scrollHeight <= box.clientHeight + 1; }
function splitBlock(box,node){
  if(!/^(P|DIV)$/.test(node.tagName) || node.querySelector('img,table,figure')) return null;
  var words=(node.textContent||'').split(/\s+/).filter(Boolean);
  if(words.length<30) return null;
  var head=node.cloneNode(false); box.appendChild(head);
  var lo=0,hi=words.length,best=0;
  while(lo<=hi){ var mid=(lo+hi)>>1; head.textContent=words.slice(0,mid).join(' ');
    if(fitsIn(box)){ best=mid; lo=mid+1; } else hi=mid-1; }
  if(best<15){ box.removeChild(head); return null; }
  head.textContent=words.slice(0,best).join(' ');
  var tail=node.cloneNode(false); tail.textContent=words.slice(best).join(' '); tail.style.textIndent='0';
  return tail;
}
function paginate(){
  var sc=$('#scroller'); sc.innerHTML='';
  var queue=bodyNodes(), i=0, guard=0;
  do{
    var pg=pageShell(guard===0); sc.appendChild(pg);
    var box=pg.querySelector('.pbody');
    while(i<queue.length){
      var node=queue[i].cloneNode(true);
      box.appendChild(node);
      if(fitsIn(box)){ i++; continue; }
      box.removeChild(node);
      if(!box.children.length){ box.appendChild(node); i++; break; }
      var tail=splitBlock(box,queue[i]);
      if(tail) queue[i]=tail;
      break;
    }
    guard++;
  } while(i<queue.length && guard<80);
  return guard;
}

/* ══ preview render ════════════════════════════════════════════ */
var pvMode='print';
function setMode(m){ pvMode=m;
  $$('#pvTgl button').forEach(function(x){ x.setAttribute('aria-selected', x.dataset.pv===m?'true':'false'); });
  renderPreview(); }
function fitPreview(){
  var wrap=$('#prevWrap'), sc=$('#scroller'), pane=$('#prevPane');
  if(!wrap||!sc||!pane) return;
  if(window.matchMedia('(max-width:1040px)').matches){ sc.style.removeProperty('--pvs'); wrap.style.height='auto'; return; }
  var avail=pane.clientWidth, natural=sc.offsetWidth||1;
  var s=Math.min(1, avail/natural);
  sc.style.setProperty('--pvs', String(s));
  wrap.style.height = Math.ceil(sc.offsetHeight*s)+'px';
}
window.addEventListener('resize',function(){ fitPreview(); });

function renderPreview(){
  if(pvMode==='print'){
    var n=paginate();
    $('#pvNote').textContent='A4 · '+n+' page'+(n===1?'':'s')+' · two columns · '+wordCount()+' words';
  } else if(pvMode==='title'){
    $('#scroller').innerHTML=titlePage();
    $('#pvNote').textContent='separate title page';
  } else {
    $('#scroller').innerHTML=webVersion();
    $('#pvNote').textContent='how it will look on the site';
  }
  fitPreview();
  if($('#pvIssues')) paintIssues($('#pvIssues'));
  if($('#sumIssues')) paintIssues($('#sumIssues'));
}
$('#pvTgl').addEventListener('click',function(e){ var b=e.target.closest('button[data-pv]'); if(b) setMode(b.dataset.pv); });
['pvVol','pvIss','pvPeriod'].forEach(function(id){
  var el=$('#'+id), key=id.replace('pv','').toLowerCase();
  el.value = (M.preview&&M.preview[key==='period'?'period':key])||'';
  el.addEventListener('input',function(){ M.preview[key]=el.value; save(); renderPreview(); });
});
$('#pvDoi').value=(M.publicationInfo||{}).doi||'';
$('#pvDoi').addEventListener('input',function(e){ M.publicationInfo.doi=e.target.value; save(); renderPreview(); });

/* ══ exports ═══════════════════════════════════════════════════ */
function slug(){ var a=M.authors[0]; var base=(a&&a.lastName)?a.lastName:'manuscript';
  var pv=M.preview||{};
  return ('GBMN-'+(pv.year||'')+'-'+(pv.vol||'')+'-'+(pv.iss||'')+'-'+base).replace(/[^A-Za-z0-9\-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,''); }
function dl(name,blob){ var u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },1500); }
function exportHtml(){
  var css=Array.prototype.map.call(document.styleSheets,function(s){
    try{ return Array.prototype.map.call(s.cssRules,function(r){return r.cssText}).join('\n'); }catch(e){ return ''; } }).join('\n');
  var doc='<!doctype html><html lang="en"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width, initial-scale=1"><title>'+esc(M.title)+'</title>'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap">'+
    '<style>'+css+'\nbody{background:#8f979d;margin:0;padding:24px 12px;display:flex;justify-content:center;overflow:auto;height:auto}'+
    '\n.web{box-shadow:0 2px 24px rgba(0,0,0,.3)}</style></head><body>'+webVersion()+'</body></html>';
  dl(slug()+'.html', new Blob([doc],{type:'text/html;charset=utf-8'}));
}
function exportJson(){
  var meta={ id:M.id, status:M.status, articleType:M.articleType, title:M.title, runningTitle:M.runningTitle, specialty:M.specialty,
    publicationInfo:M.publicationInfo, checklistAgreed:M.checklistAgreed,
    authors:M.authors, abstract:stripTags(M.abstractContents.text||''),
    keywords:(M.sections['Keywords']||'').split(/[;,]/).map(function(x){return x.trim()}).filter(Boolean),
    sections:M.sections, references:M.references, supplementaryFiles:M.supplementaryFiles.map(function(f){return {fileName:f.fileName,description:f.description,fileSize:f.fileSize}}),
    ethics:M.ethics, conflictDisclosure:{hasConflict:M.conflictDisclosure.hasConflict,conflictDetails:M.conflictDisclosure.conflictDetails,signedCoiFormName:M.conflictDisclosure.signedCoiFormName},
    fundingDetails:M.fundingDetails, wordCount:wordCount(), updatedAt:M.updatedAt };
  dl(slug()+'.json', new Blob([JSON.stringify(meta,null,2)],{type:'application/json'}));
}
$('#btnPdf').addEventListener('click',function(){
  if(pvMode!=='print') setMode('print');
  setTimeout(function(){ window.print(); },150); });
$('#btnHtml').addEventListener('click',exportHtml);

/* ══ boot ══════════════════════════════════════════════════════ */
function renderAll(){ renderSidebar(); renderStep(); renderPreview(); }
renderAll();
})();
