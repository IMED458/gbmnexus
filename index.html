<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBMN Manuscript Submission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
:root{
  --teal:#0f766e; --teal-d:#115e59; --teal-900:#134e4a; --teal-50:#f0fdfa; --teal-100:#ccfbf1; --teal-200:#99f6e4; --teal-300:#5eead4;
  --s50:#f8fafc; --s100:#f1f5f9; --s200:#e2e8f0; --s300:#cbd5e1; --s400:#94a3b8; --s500:#64748b; --s600:#475569; --s700:#334155; --s800:#1e293b;
  --amber50:#fffbeb; --amber200:#fde68a; --amber700:#b45309; --amber900:#78350f;
  --rose50:#fff1f2; --rose200:#fecdd3; --rose700:#be123c;
  --em50:#ecfdf5; --em200:#a7f3d0; --em700:#047857; --em900:#064e3b;
  --ui:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --doc:'Carlito',Calibri,'Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --cond:'Bahnschrift','DIN Alternate','Archivo Narrow','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--ui);color:var(--s800);background:#eef1f4;font-size:13px;line-height:1.5;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,h5{margin:0;font-weight:700}
p{margin:0}

/* ── three independent scroll panes ── */
.app{height:100%;display:grid;grid-template-columns:286px minmax(0,1fr) minmax(0,1fr);}
.pane{min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.side{background:#fff;border-right:1px solid var(--s200);padding:16px 14px 40px}
.mid{background:#eef1f4;padding:16px 18px 60px}
.prev{background:#9ea7ad;padding:0}
@media (max-width:1280px){.app{grid-template-columns:250px minmax(0,1fr) minmax(0,1fr)}}
@media screen and (max-width:1040px){
  body{overflow:auto}
  .app{display:block;height:auto}
  .pane{overflow:visible;height:auto}
  .side{border-right:0;border-bottom:1px solid var(--s200)}
}

/* ── brand ── */
.brand{display:flex;gap:10px;align-items:center;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--s100)}
.brand img{height:30px;width:auto}
.brand b{display:block;font-size:12px;line-height:1.25}
.brand span{font-size:10px;color:var(--s400)}

/* ── sidebar ── */
.sidehead{border-bottom:1px solid var(--s100);padding-bottom:12px;margin-bottom:12px}
.sidehead h3{font-size:10px;text-transform:uppercase;color:var(--s400);letter-spacing:.08em}
.sidehead .t{font-size:12.5px;font-weight:600;color:var(--teal-d);margin-top:4px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sidehead .badge{display:inline-flex;margin-top:5px;padding:1px 6px;border-radius:2px;font-size:9.5px;font-weight:700;
  background:var(--amber50);color:var(--amber900);border:1px solid var(--amber200)}
.stp{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border:0;border-radius:8px;
  background:transparent;text-align:left;font-size:11.5px;font-weight:500;color:var(--s600);cursor:pointer;transition:background .12s}
.stp:hover{background:var(--s50);color:var(--s800)}
.stp.on{background:var(--teal);color:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.stp .lt{display:flex;align-items:center;gap:9px;min-width:0}
.stp .ic{width:15px;height:15px;flex:0 0 15px;opacity:.85}
.stp .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stp .st{width:15px;height:15px;flex:0 0 15px}
.sthelp{padding:2px 11px 7px;font-size:10px;line-height:1.35;color:var(--amber700)}
.prog{margin-top:18px;padding-top:14px;border-top:1px solid var(--s100)}
.prog .pl{display:flex;justify-content:space-between;font-size:10.5px;font-weight:600;color:var(--s500);margin-bottom:5px}
.prog .tr{height:8px;border-radius:99px;background:var(--s100);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--teal);transition:width .4s}
.prog .fn{font-size:10px;color:var(--s400);font-style:italic;margin-top:7px}

/* ── form panel ── */
.panel{background:#fff;border:1px solid var(--s200);border-radius:16px;padding:20px 22px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.phead{border-bottom:1px solid var(--s100);padding-bottom:14px;margin-bottom:18px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.phead .k{font-size:10px;text-transform:uppercase;font-weight:700;color:var(--teal);letter-spacing:.07em}
.phead h2{font-size:18px;color:var(--s800);margin-top:2px}
.stepbody>*+*{margin-top:16px}
.lbl{display:block;font-weight:700;color:var(--s700);font-size:11.5px;margin-bottom:4px}
.lbl .req{color:#dc2626}
.inp,.sel,.ta{width:100%;background:var(--s50);border:1px solid var(--s300);border-radius:8px;padding:8px 10px;font-size:12.5px}
.inp.sm,.sel.sm{padding:6px 8px;border-radius:6px}
.ta{resize:vertical;min-height:72px;line-height:1.5}
.inp:focus,.sel:focus,.ta:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.inp.mono{font-family:var(--mono);color:var(--teal-d);background:var(--s100)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.span2{grid-column:span 2}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}.span2{grid-column:auto}}
.box{background:var(--s50);border:1px solid var(--s200);border-radius:12px;padding:14px}
.boxw{background:#fff;border:1px solid var(--s200);border-radius:12px;padding:16px}
.box>*+*,.boxw>*+*{margin-top:10px}
.note{font-size:11px;color:var(--s500)}
.ital{font-style:italic;color:var(--s400);font-size:11px}
.btn{border:1px solid var(--s300);background:#fff;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;color:var(--s700)}
.btn:hover{background:var(--s50)}
.btn.t{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.t:hover{background:var(--teal-d)}
.btn.tl{background:var(--teal-50);border-color:var(--teal-200);color:var(--teal-d)}
.btn.sm{padding:4px 9px;font-size:10.5px;border-radius:6px}
.btn.rd{color:var(--rose700);border-color:var(--rose200);background:var(--rose50)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.45;cursor:pointer}
.chk input{margin-top:2px;accent-color:var(--teal);width:15px;height:15px;flex:0 0 15px}
.radio{display:inline-flex;gap:6px;align-items:center;font-weight:700;cursor:pointer;font-size:12px}
.radio input{accent-color:var(--teal)}
.tile{display:block;width:100%;text-align:left;border:2px solid var(--s200);background:var(--s50);border-radius:12px;padding:14px;cursor:pointer}
.tile:hover{border-color:var(--s300);background:#fff}
.tile.on{border-color:var(--teal);background:var(--teal-50);box-shadow:0 2px 6px rgba(0,0,0,.07)}
.tile b{font-size:12.5px;color:var(--s800)}
.tile p{font-size:10.5px;color:var(--s500);margin-top:5px;line-height:1.35}
.tile .m{border-top:1px solid var(--s200);margin-top:10px;padding-top:8px;display:flex;justify-content:space-between;font-size:9.5px;font-family:var(--mono);color:var(--teal-d)}
.infobox{border-left:4px solid var(--teal);background:var(--teal-50);border-radius:0 8px 8px 0;padding:12px 14px}
.infobox h4{font-size:12.5px;color:var(--teal-900)}
.infobox p{font-size:11px;color:var(--teal-d);margin-top:4px;line-height:1.5}
.drop{border:2px dashed var(--s300);background:#fff;border-radius:8px;padding:18px;text-align:center}
.drop b{display:block;color:var(--s700);font-size:12px;margin-bottom:5px}
.pill{display:inline-block;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:700;background:var(--teal-50);color:var(--teal)}
.rowcard{background:#fff;border:1px solid var(--s200);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.rowcard+.rowcard{margin-top:8px}
.rowcard .nm{font-weight:700;color:var(--s800);font-size:12px}
.rowcard .af{color:var(--s500);font-size:10px;margin-top:2px}
.rowcard .or{color:#4d7c0f;font-family:var(--mono);font-size:9.5px;margin-top:1px}
.iconbtn{border:1px solid var(--s200);background:var(--s50);border-radius:6px;padding:4px 6px;cursor:pointer;line-height:0}
.iconbtn:disabled{opacity:.4;cursor:not-allowed}
.iconbtn svg{width:13px;height:13px}
.tagbtn{padding:3px 8px;border-radius:6px;background:#fff;border:1px solid var(--s200);font-size:10px;cursor:pointer}
.reflist{list-style:decimal;padding-left:20px;max-height:200px;overflow-y:auto;margin:0}
.reflist li{font-size:11px;color:var(--s700);margin-bottom:7px;line-height:1.45}
.reflist .lk{color:var(--teal);font-weight:700;margin-left:7px;cursor:pointer;background:0;border:0;padding:0;font-size:10.5px}
.reflist .lk:disabled{color:var(--s300);cursor:not-allowed}
.reflist .lk.rd{color:var(--rose700)}
.navbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:16px;margin-top:18px;border-top:1px solid var(--s100)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:90;padding:9px 16px;border-radius:9px;font-size:12px;font-weight:600;
  box-shadow:0 6px 24px rgba(0,0,0,.2);color:#fff;background:var(--teal);opacity:0;pointer-events:none;transition:opacity .2s,bottom .2s}
.toast.on{opacity:1;bottom:30px}
.toast.err{background:#be123c}.toast.info{background:var(--s700)}
.secbtn{text-align:left;border:1px solid var(--s200);background:rgba(255,255,255,.7);border-radius:8px;padding:8px 11px;cursor:pointer;width:100%}
.secbtn.on{border-color:var(--teal);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.secbtn .n{display:block;font-size:9.5px;text-transform:uppercase;font-weight:700;color:var(--s400)}
.secbtn .t{display:block;font-weight:700;font-size:11.5px;color:var(--s700);margin-top:1px}
.secbtn .s{display:block;font-size:9.5px;margin-top:3px}
.secbtn .s.ok{color:var(--em700)}.secbtn .s.no{color:var(--amber700)}
.chklist{display:grid;gap:7px}
.chkopt{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--s200);border-radius:8px;background:#fff;cursor:pointer;font-size:11px}
.chkopt.on{background:var(--teal-50);border-color:var(--teal-300);color:var(--teal-900)}
.chkopt input{accent-color:var(--teal)}

/* ── rich text editor ── */
.rte{display:flex;flex-direction:column;gap:6px}
.rte>.cap{font-weight:700;color:var(--s800);font-size:11.5px}
.rte>.hint{font-size:10px;color:var(--s500);font-style:italic}
.rtbar{display:flex;flex-wrap:wrap;gap:4px;background:var(--s100);border:1px solid var(--s300);border-bottom:0;border-radius:8px 8px 0 0;padding:6px}
.rtbar select{height:28px;border:1px solid var(--s300);background:#fff;padding:0 6px;font-size:11px;font-weight:600}
.rtbar button{height:28px;min-width:28px;border:1px solid var(--s300);background:#fff;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.rtbar button:hover{background:var(--s50);border-color:var(--teal)}
.rtbar svg{width:14px;height:14px}
.rtbar .div{width:1px;background:var(--s300);margin:0 2px}
.rtsel{display:flex;flex-wrap:wrap;gap:7px;align-items:center;border:1px solid var(--teal-200);border-bottom:0;background:var(--teal-50);padding:7px 11px;font-size:10.5px}
.rtsel b{color:var(--teal-900)}
.rtarea{width:100%;background:#fff;border:1px solid var(--s300);border-radius:0 0 8px 8px;padding:12px;font-family:var(--doc);font-size:14px;line-height:1.65;color:var(--s800);min-height:320px;max-height:58vh;overflow-y:auto}
.rtarea:focus{outline:0;box-shadow:0 0 0 1px var(--teal)}
.rtarea:empty:before{content:attr(data-ph);color:#9ca3af}
.rtarea ul{list-style:disc;padding-left:1.5em}
.rtarea ol{list-style:decimal;padding-left:1.5em}
.rtarea h3{font-size:15px;font-weight:700;margin:10px 0 4px}
.rtwc{font-size:10px;color:var(--s400);font-family:var(--mono);font-style:italic}
.gbmn-inline-media{break-inside:avoid;margin:12px 0;border:1px solid var(--s300);padding:8px;background:#fff;cursor:move;position:relative}
.gbmn-inline-media.sel{outline:2px solid var(--teal);outline-offset:2px}
.gbmn-inline-media img{display:block;max-width:100%;height:auto;margin:0 auto}
.gbmn-inline-media figcaption{margin-top:6px;font-family:Arial,sans-serif;font-size:11px;color:var(--s600)}
.gbmn-inline-table{width:100%;table-layout:fixed;border-collapse:collapse;font-family:Arial,sans-serif;font-size:11px}
.gbmn-inline-table th,.gbmn-inline-table td{border:1px solid var(--s300);padding:4px 6px;overflow-wrap:anywhere;vertical-align:top}
.gbmn-inline-table th{background:var(--s100);font-weight:700}
.gbmn-inline-media-diagram pre{white-space:pre-wrap;font-family:var(--mono);font-size:11px;background:var(--s50);padding:8px}
.gbmn-media-actions{position:absolute;top:4px;right:4px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.gbmn-inline-media:hover .gbmn-media-actions,.gbmn-inline-media.sel .gbmn-media-actions{opacity:1}
.gbmn-media-actions button{border:1px solid var(--s300);background:#fff;border-radius:4px;font-size:10px;font-weight:700;padding:2px 6px;cursor:pointer;color:var(--s700)}
.gbmn-media-actions button[data-media-action=delete]{color:#b91c1c}

/* ── modal ── */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,.3);padding:16px}
.modal .sheet{background:#fff;width:100%;max-width:760px;max-height:calc(100vh - 48px);overflow-y:auto;border:1px solid var(--s300);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--s200)}
.modal .mh h3{font-size:19px;font-weight:400;color:#0f172a}
.modal .mh p{font-size:12.5px;color:var(--s600);margin-top:4px}
.modal .mb{padding:18px 20px}
.modal .mb>*+*{margin-top:14px}
.modal .mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--s200);background:var(--s50)}
.modal .x{border:0;background:0;cursor:pointer;font-size:22px;line-height:1;color:var(--s500);padding:0 2px}
.modal input[type=text],.modal textarea,.modal select{width:100%;border:1px solid var(--s300);padding:8px 11px;font-size:12.5px;background:#fff;border-radius:0}
.modal textarea{resize:vertical}
.modal .btn-ins{padding:8px 18px;font-size:12.5px;font-weight:600;border:0;border-radius:6px;background:#7dd3fc;color:#fff;cursor:pointer}
.modal .btn-ins:disabled{opacity:.5;cursor:not-allowed}
.modal .btn-c{padding:8px 18px;font-size:12.5px;font-weight:600;border:1px solid var(--s300);border-radius:6px;background:#fff;color:var(--s600);cursor:pointer}

/* ── preview chrome ── */
.prevbar{position:sticky;top:0;z-index:3;background:#787f85;color:#fff;display:flex;gap:9px;align-items:center;padding:8px 13px;font-size:11.5px;flex-wrap:wrap}
.prevbar .tgl{display:flex;gap:2px;background:rgba(0,0,0,.18);border-radius:999px;padding:2px}
.prevbar .tgl button{border:0;background:transparent;color:#e9edef;border-radius:999px;padding:4px 12px;font-size:11.5px;cursor:pointer}
.prevbar .tgl button[aria-selected=true]{background:#fff;color:#20262b;font-weight:600}
.prevbar input{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:5px;padding:3px 7px;font-size:11px;width:74px}
.prevbar input::placeholder{color:rgba(255,255,255,.6)}
.prevbar .note{opacity:.85;margin-left:auto}
.prevbar .pbtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer}
.prevbar .pbtn:hover{background:rgba(255,255,255,.22)}
.prevwrap{overflow:hidden}
.scroller{width:calc(210mm + 28px);padding:18px 14px 70px;display:flex;flex-direction:column;align-items:center;gap:18px;
  transform-origin:top left;transform:scale(var(--pvs,1))}
@media screen and (max-width:1040px){.scroller{width:100%;transform:none}}
.scroller.webmode{width:100%;transform:none !important;padding:0;display:block}
#webFrame{display:block;width:100%;height:calc(100vh - 42px);border:0;background:#fff}
@media screen and (max-width:1040px){#webFrame{height:150vh}}
.rolebox{border:1px solid var(--s200);border-radius:10px;padding:10px;margin-bottom:12px;background:var(--s50)}
.rolebox label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--s400);font-weight:700;margin-bottom:4px}
.rolebox select{width:100%;border:1px solid var(--s300);border-radius:6px;padding:5px 7px;font-size:11.5px;background:#fff}
.rolebox .ed{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.rolebox .ed button{font-size:10.5px;padding:5px 8px}
.rolebox .hint{font-size:9.5px;color:var(--s500);line-height:1.4;margin-top:6px}

/* ══ the document — measured against the printed GBMN article ══
   A4 595.3×841.9pt · text 40→556pt · columns 240.3pt, gap 35.3pt
   body Calibri 11/14.3pt · masthead and footer on every page       */
.paper{background:transparent}
.page{width:210mm;height:297mm;background:#fff;box-shadow:0 2px 18px rgba(0,0,0,.28);
  font-family:var(--doc);color:#1F2A2A;padding:6mm 13.86mm 8.4mm 14.11mm;
  display:flex;flex-direction:column;overflow:hidden;position:relative}
.page + .page{margin-top:18px}
.page .pbody{flex:1 1 auto;min-height:0;overflow:hidden}
.page .pfront{flex:0 0 auto}

/* masthead — repeats on every page */
.pmast{display:flex;align-items:flex-end;justify-content:space-between;gap:10mm;flex:0 0 auto}
.pmast img{width:112.9mm;height:auto;aspect-ratio:1834/414;display:block;margin-left:-3.53mm}
.pmast .vol{font-family:var(--cond);font-size:9pt;color:#000;white-space:nowrap;letter-spacing:.01em;padding-bottom:.4mm}
.prule{border:0;border-top:2.25pt solid #006666;margin:1.6mm 0 0}
.prule2{border:0;border-top:.75pt solid #006666;margin:.26mm 0 0}

/* front matter */
.ptitle{font-size:19.6pt;line-height:1.19;font-weight:700;color:#006F68;text-align:center;margin:9.5mm 0 0;text-wrap:balance}
.pauth{font-size:12pt;color:#686868;text-align:center;line-height:1.35;margin:6.4mm 0 0}
.pauth sup{font-size:8pt;font-weight:700;color:#006F68;vertical-align:super}
.pauth a{color:#006F68;text-decoration:none}
.pabs-h{font-size:11pt;font-weight:700;color:#B9353A;letter-spacing:.01em;margin:5.3mm 0 .9mm}
.pabs{font-size:10pt;line-height:1.22;text-align:justify;hyphens:auto}
.pabs p{margin:0}
.pabs .lb,.pabs b,.pabs strong{font-weight:700;color:#006F68}
.pdoi{font-size:11pt;font-weight:700;color:#008080;margin:4.2mm 0 0}
.pdoi a,.pdoi span.u{color:#008080;text-decoration:underline}

/* body — two columns, exactly the printed measure */
.pbody{font-size:11pt;line-height:1.3;text-align:justify;hyphens:auto;
  column-count:2;column-gap:12.45mm;column-fill:auto;margin-top:4.3mm}
.pbody p{margin:0;text-indent:5mm}
.pbody p.first,.pbody .after-heading{text-indent:0}
.pbody h2{font-size:11pt;font-weight:700;color:#B9353A;letter-spacing:.01em;margin:3.2mm 0 .4mm;break-after:avoid;text-transform:uppercase}
.pbody h3{font-size:11pt;font-weight:700;color:#006F68;font-style:italic;margin:2.4mm 0 .4mm;break-after:avoid}
.pbody sup{font-size:7pt;color:#008080;font-weight:700}
.pbody ul,.pbody ol{margin:0 0 1mm;padding-left:6mm;text-align:left}
.pbody ol.refs{font-size:9.5pt;line-height:1.26;padding-left:5mm;margin:0}
.pbody ol.refs li{margin:0 0 .6mm;text-align:justify}
.pbody .decl p{margin:0 0 1.1mm;text-indent:0}
.pbody .decl b{color:#006F68}
.pbody .afflist{font-size:9.5pt;line-height:1.3}
.pbody .afflist p{margin:0 0 .6mm;text-indent:0}
.pbody .afflist sup{font-size:7pt;color:#006F68}

/* figures and tables */
.pbody figure.fg,.pbody .tbl{margin:2.2mm 0 2.8mm;break-inside:avoid;page-break-inside:avoid}
.pbody figure.fg{padding:0}
.pbody figure.fg img{max-width:100%;width:auto;height:auto;display:block;margin:0 auto;max-height:95mm}
.pbody figure.fg pre{white-space:pre-wrap;font-family:var(--mono);font-size:8pt;background:#f6f8f8;padding:1.5mm;margin:0}
.pbody .cap{font-size:8.5pt;line-height:1.3;margin:0 0 1mm;text-align:justify;text-indent:0;break-after:avoid}
.pbody .cap b{color:#006F68}
.pbody figure.fg .cap{margin:1.1mm 0 0}
.pbody .tbl table{width:100%;border-collapse:collapse;font-size:8.5pt;table-layout:fixed}
.pbody .tbl th,.pbody .tbl td{border-top:.6pt solid #9aa5a5;border-bottom:.6pt solid #9aa5a5;padding:.9mm 1.3mm;
  text-align:center;vertical-align:middle;overflow-wrap:anywhere}
.pbody .tbl thead th{background:#DFEEDD;font-weight:700;color:#14201e}
/* full article width beats the column flow */
.pbody > .one-col{column-span:all;-webkit-column-span:all;width:100%;display:block;break-inside:avoid;margin:2.5mm 0 3mm}

/* footer — on every page */
.pfoot{margin-top:auto;padding-top:2mm;font-family:var(--cond);font-size:8pt;color:#000;text-align:center;line-height:1.2;flex:0 0 auto}

/* title page extras */
.tp-meta{margin-top:7mm;border-top:.9px solid #cfd6d6}
.tp-meta div{display:grid;grid-template-columns:46mm 1fr;font-size:9.5pt;border-bottom:.9px solid #e4e9e9}
.tp-meta span.k{padding:1.5mm 2mm;font-weight:700;color:#006F68}
.tp-meta span.v{padding:1.5mm 2mm}
.tp-note{margin-top:5mm;font-size:8.5pt;color:#6a7278;line-height:1.45}

.page [contenteditable="true"]:focus{outline:0;box-shadow:inset 0 0 0 1px #00786d;background:#fbfffb}
.no-content{color:#8a9999;font-style:italic}

@media screen and (max-width:1040px){
  .page{width:100%;height:auto;padding:14px;box-shadow:0 1px 8px rgba(0,0,0,.22);overflow:visible}
  .page .pbody{overflow:visible;column-count:1}
  .pmast img{width:64%;margin-left:0}
}

/* ── print: the proof prints exactly as it reads on screen ── */
@page{size:A4;margin:0}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff;margin:0;padding:0;height:auto;overflow:visible}
  .side,.mid,.prevbar,.toast,.modal{display:none !important}
  .app{display:block;height:auto}
  .pane{overflow:visible}
  .prev{overflow:visible;background:#fff}
  .prevwrap{overflow:visible;height:auto !important}
  .scroller{width:auto;transform:none !important;padding:0;gap:0;display:block;align-items:stretch}
  .page{width:210mm;height:297mm;box-shadow:none;break-after:page;page-break-after:always;margin:0;overflow:hidden}
  .page:last-child{break-after:auto;page-break-after:auto}
  a{color:inherit}
}
</style>
</head>
<body>
<div class="app">

  <aside class="pane side" id="sidePane">
    <div class="brand">
      <img id="brandLogo" alt="GBMN">
      <div><b>Georgian Biomedical and Medical Nexus</b><span>Manuscript submission</span></div>
    </div>
    <div class="rolebox">
      <label for="roleSel">Signed in as</label>
      <select id="roleSel">
        <option value="author">Author</option>
        <option value="editor">Editor</option>
        <option value="manager">Journal manager</option>
      </select>
      <div class="ed" id="roleTools"></div>
    </div>
    <div class="sidehead">
      <h3>Submission Workflow</h3>
      <div class="t" id="sideTitle">Untitled Manuscript Draft</div>
      <span class="badge" id="sideStatus">Manuscript Status: Draft</span>
    </div>
    <nav id="sideNav"></nav>
    <div class="prog">
      <div class="pl"><span>Overall Submission Readiness</span><span id="progPct">0%</span></div>
      <div class="tr"><i id="progBar" style="width:0%"></i></div>
      <div class="fn">All sections must show green or amber status before final submittal.</div>
    </div>
  </aside>

  <main class="pane mid" id="midPane">
    <div class="panel">
      <div class="phead">
        <div>
          <span class="k" id="stepKicker">Step Profile</span>
          <h2 id="stepTitle"></h2>
        </div>
        <div id="stepAction"></div>
      </div>
      <div class="stepbody" id="stepBody"></div>
      <div class="navbar">
        <button class="btn" id="btnPrev" type="button">&larr; Save and Back</button>
        <button class="btn tl" id="btnSave" type="button">Save</button>
        <button class="btn t" id="btnNext" type="button">Save and Continue &rarr;</button>
      </div>
    </div>
  </main>

  <section class="pane prev" id="prevPane">
    <div class="prevbar">
      <div class="tgl" id="pvTgl">
        <button type="button" data-pv="print" aria-selected="true">PDF</button>
        <button type="button" data-pv="title" aria-selected="false">Title page</button>
        <button type="button" data-pv="web" aria-selected="false">Web</button>
      </div>
      <button class="pbtn" id="btnPdf" type="button">PDF</button>
      <button class="pbtn" id="btnDocx" type="button">Word</button>
      <button class="pbtn" id="btnHtml" type="button">HTML</button>
      <button class="pbtn" id="btnJats" type="button">JATS XML</button>
      <button class="pbtn" id="btnPubmed" type="button">PubMed XML</button>
      <span class="note" id="pvNote"></span>
    </div>
    <div class="prevwrap" id="prevWrap"><div class="scroller" id="scroller"></div></div>
  </section>

</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

var KEY='gbmnManuscript';

function load(){ try{ var raw=localStorage.getItem(KEY); if(!raw)return;
  var o=JSON.parse(raw); if(!o||typeof o!=='object')return;
  var base=blankManuscript();
  Object.keys(base).forEach(function(k){ if(o[k]===undefined) o[k]=base[k]; });
  ['publicationInfo','ethics','conflictDisclosure','fundingDetails','preview','abstractContents'].forEach(function(k){
    o[k]=Object.assign({}, base[k], o[k]||{}); });
  M=o;
}catch(e){} }

function sanitizeRichPaste(html){
  var d=document.createElement('div'); d.innerHTML=html;
  d.querySelectorAll('script,style,meta,link').forEach(function(n){n.remove()});
  d.querySelectorAll('*').forEach(function(n){
    Array.prototype.slice.call(n.attributes).forEach(function(a){
      if(/^on/i.test(a.name)) n.removeAttribute(a.name);
      if(a.name==='class'&&!/gbmn-/.test(a.value)) n.removeAttribute('class');
      if(a.name==='style') n.removeAttribute('style');
    });
    if(n.tagName==='TABLE') n.className='gbmn-inline-table';
  });
  return d.innerHTML;
}

  function updWc(){ if(!wc)return; var n=stripTags(area.innerHTML); wc.textContent='Word count: '+(n?n.split(/\s+/).length:0); }
  function push(){ history=history.slice(-24).concat([area.innerHTML]); }
  function saveSel(){ var s=window.getSelection(); if(!s||!s.rangeCount)return;

  function makeMarker(){ clearMarker(); area.focus();
    var s=window.getSelection(), live=(s&&s.rangeCount)?s.getRangeAt(0):null;
    var r = (savedRange&&area.contains(savedRange.commonAncestorContainer)) ? savedRange.cloneRange()
          : (live&&area.contains(live.commonAncestorContainer)) ? live.cloneRange() : document.createRange();
    if(!(savedRange&&area.contains(savedRange.commonAncestorContainer))&&!(live&&area.contains(live.commonAncestorContainer))){
      r.selectNodeContents(area); r.collapse(false); }
    r.deleteContents();
    var id=nid('mk'), sp=document.createElement('span');

  function insertHtml(html){

    else if(savedRange&&area.contains(savedRange.commonAncestorContainer)){ savedRange.deleteContents(); savedRange.insertNode(frag); }
    else area.appendChild(frag);
    markerId=null;
    if(last) caretAfter(last);

  }
  function pickMedia(){ return selId? area.querySelector('.gbmn-inline-media[data-media-id="'+selId+'"]') : null; }

  /* ── block formatting, done by hand: execCommand('formatBlock') is

  function ensureBlocks(){

    Array.prototype.slice.call(area.childNodes).forEach(function(n){
      if(n.nodeType===1 && /^(P|H[1-6]|UL|OL|FIGURE|BLOCKQUOTE|PRE|TABLE|DIV)$/.test(n.tagName)){ run=null; return; }
      if(n.nodeType===3 && !n.textContent.replace(/\u200b/g,'').trim()){ return; }
      if(!run){ run=document.createElement('p'); area.insertBefore(run,n); changed=true; }
      run.appendChild(n);
    });

  }
  function blockOf(node){
    while(node&&node!==area){ if(node.nodeType===1&&/^(P|H[1-6]|LI|BLOCKQUOTE|PRE|DIV)$/.test(node.tagName)) return node;
      node=node.parentNode; }
    return null;
  }
  function setBlock(kind){
    ensureBlocks();                      /* settle the DOM before reading the selection */
    area.focus();
    var sel=window.getSelection();
    if(savedRange&&area.contains(savedRange.commonAncestorContainer)){
      try{ sel.removeAllRanges(); sel.addRange(savedRange); }catch(e){} }
    var list=[];
    if(sel.rangeCount){
      var r=sel.getRangeAt(0);
      list=Array.prototype.filter.call(area.children,function(el){
        try{ return r.intersectsNode(el); }catch(e){ return false; } });
      if(!list.length){ var b=blockOf(r.startContainer)||blockOf(sel.anchorNode); if(b) list=[b]; }
    }
    if(!list.length && area.children.length) list=[area.children[area.children.length-1]];
    if(!list.length){ var p=document.createElement(kind==='subheading'?'h3':'p'); p.innerHTML='<br>'; area.appendChild(p); list=[p]; }
    var want=kind==='subheading'?'H3':'P', last=null;
    list.forEach(function(el){
      if(!/^(P|H[1-6]|DIV)$/.test(el.tagName)) return;
      if(el.tagName===want){ last=el; return; }
      var n=document.createElement(want);
      n.innerHTML=el.innerHTML||'<br>';
      el.parentNode.replaceChild(n,el); last=n;
    });
    if(last){ var rr=document.createRange(); rr.selectNodeContents(last); rr.collapse(false);
      sel.removeAllRanges(); sel.addRange(rr); savedRange=rr.cloneRange(); }
    emit(); detect();
  }

    if(a==='undo'){ var prev=history.pop(); if(prev===undefined){document.execCommand('undo'); } else { area.innerHTML=prev; setSel(null); } emit(); return; }

  function detect(){ var s=window.getSelection(); if(!s||!s.rangeCount){blk.value='normal';return}

function normalizeKeywords(v){ var k=v.split(/[;,]/).map(function(x){return x.trim()}).filter(Boolean); return k.length? k.join('; ')+'.' : ''; }
function fileSizeLabel(f){ return f.size<1048576 ? Math.max(1,Math.round(f.size/1024))+' KB' : (f.size/1048576).toFixed(1)+' MB'; }

function formatAMAReference(ref){
  if(!ref.authors||!ref.title||!ref.journalOrBook||!ref.year) return 'Incomplete citation data provided';
  var a=ref.authors.trim(); if(a.slice(-1)!=='.') a+='.';
  var t=ref.title.trim(), vol=ref.volume?String(ref.volume).trim():'', iss=ref.issue?'('+ref.issue+')':'',
      pg=ref.pages?':'+ref.pages:'', sfx=ref.doi?' doi:'+ref.doi:(ref.url?' Available at: '+ref.url:'');
  if(ref.type==='journal') return a+' '+t+'. *'+ref.journalOrBook+'*. '+ref.year+';'+vol+iss+pg+'.'+sfx;
  if(ref.type==='book') return a+' *'+ref.journalOrBook+'*. '+ref.year+(vol?', Vol '+vol:'')+(ref.pages?', p. '+ref.pages:'')+'.'+sfx;
  return a+' '+t+'. *'+ref.journalOrBook+'*. Published '+ref.year+'.'+sfx;
}

function orcidLookup(){
  var clean=(AF.orcid||'').replace(/^https?:\/\/orcid\.org\//i,'').trim();
  if(!clean) return;
  AF.busy=true; renderStep();
  fetch('https://pub.orcid.org/v3.0/'+clean+'/record',{headers:{Accept:'application/json'}})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(rec){
      var nm=rec&&rec.person&&rec.person.name||{};
      var given=(nm['given-names']||{}).value||'', family=(nm['family-name']||{}).value||'';
      var emails=((rec.person||{}).emails||{}).email||[];
      var grp=((rec['activities-summary']||{}).employments||{})['affiliation-group']||[];
      var org=grp[0]&&grp[0].summaries&&grp[0].summaries[0]&&grp[0].summaries[0]['employment-summary']&&grp[0].summaries[0]['employment-summary'].organization;
      if(given&&!AF.first)AF.first=given; if(family&&!AF.last)AF.last=family;
      if(emails[0]&&emails[0].email&&!AF.email)AF.email=emails[0].email;
      if(org&&org.name){ if(!AF.inst)AF.inst=org.name;
        if(org.address){ if(!AF.city&&org.address.city)AF.city=org.address.city; if(!AF.country&&org.address.country)AF.country=org.address.country; }
        var full=[AF.dept,org.name,org.address&&org.address.city,org.address&&org.address.country].filter(Boolean).join(', ');
        if(full&&AF.affiliations.indexOf(full)<0) AF.affiliations.push(full); }
      AF.orcid=clean; AF.busy=false; renderStep();
      notify('ORCID author metadata imported where available.','success'); })
    .catch(function(){ AF.busy=false; renderStep();
      notify('ORCID metadata could not be imported. You can complete author fields manually.','error'); });
}
function addAuthor(e){
  e.preventDefault();
  var affs = AF.affiliations.length ? AF.affiliations.slice()
           : [AF.affil || [AF.dept,AF.inst,AF.city,AF.country].filter(Boolean).join(', ')].filter(Boolean);
  if(!AF.first||!AF.last||!AF.orcid||(!AF.inst&&!affs.length)){
    notify('First name, Last Name, Affiliation, and Mandated ORCID iD are required.','error'); return; }
  var core=AF.tags.some(function(t){return ['Substantial contributions to concept or design','Acquisition, analysis, or interpretation of data'].indexOf(t)>=0});
  var writ=AF.tags.some(function(t){return ['Drafting of the manuscript','Critical review of the manuscript for important intellectual content'].indexOf(t)>=0});
  var req=['Agreed to be accountable for all aspects of the work','Will review the final version to be published'].every(function(t){return AF.tags.indexOf(t)>=0});
  if(!core||!writ||!req){ notify('Each author must have concept/data, writing/review, accountability, and final review contributions checked.','error'); return; }
  var a={ id:AF.editingId||nid('auth'), firstName:AF.first, middleInitial:AF.middle||undefined, lastName:AF.last,
    email:AF.email, phone:AF.phone, orcidId:AF.orcid, specialty:AF.spec, country:AF.country, city:AF.city,
    institution:AF.inst, department:AF.dept, affiliation:affs[0], affiliations:affs, academicTitle:AF.title,
    contributionRole:AF.contrib||AF.tags.join('; '), contributionTags:AF.tags.slice(), isCorresponding:AF.corr };
  var list = AF.editingId ? M.authors.filter(function(x){return x.id!==AF.editingId}) : M.authors.slice();
  if(AF.corr) list=list.map(function(x){ x.isCorresponding=false; return x; });
  if(AF.editingId){ var idx=M.authors.map(function(x){return x.id}).indexOf(AF.editingId);
    list.splice(idx>=0?Math.min(idx,list.length):list.length,0,a); } else list.push(a);
  M.authors=list;
  notify('Author '+AF.first+' '+AF.last+' successfully '+(AF.editingId?'updated':'added')+'!','success');
  resetAF(); restep();
}

/* ══ ZIP writer (stored, no deflate) ═══════════════════════════ */
var CRCT=(function(){var t=new Int32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c;}return t;})();
function crc32(buf){var c=-1;for(var i=0;i<buf.length;i++)c=CRCT[(c^buf[i])&0xFF]^(c>>>8);return (c^-1)>>>0;}
function utf8(s){return new TextEncoder().encode(s);}
function zipStore(entries){
  var parts=[],central=[],offset=0;
  function u16(n){return [n&255,(n>>8)&255]} function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255]}
  entries.forEach(function(e){
    var name=utf8(e.name), data=(e.data instanceof Uint8Array)?e.data:utf8(e.data), crc=crc32(data);
    var h=[].concat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
    var head=new Uint8Array(h.length+name.length); head.set(h,0); head.set(name,h.length);
    parts.push(head,data);
    var c=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),
      u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    var cen=new Uint8Array(c.length+name.length); cen.set(c,0); cen.set(name,c.length);
    central.push(cen); offset+=head.length+data.length;
  });
  var csize=central.reduce(function(n,c){return n+c.length},0);
  var end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(entries.length),u16(entries.length),u32(csize),u32(offset),u16(0)));
  return new Blob(parts.concat(central,[end]),{type:'application/zip'});
}

/* ══ HTML → normalised blocks ══════════════════════════════════ */
function runsOf(node,fmt){
  var out=[];
  Array.prototype.forEach.call(node.childNodes,function(n){
    if(n.nodeType===3){ var t=n.textContent.replace(/\s+/g,' '); if(t) out.push({t:t,b:fmt.b,i:fmt.i,u:fmt.u,sup:fmt.sup,sub:fmt.sub}); return; }
    if(n.nodeType!==1) return;
    var g=n.tagName, f={b:fmt.b||/^(B|STRONG|H[1-6])$/.test(g), i:fmt.i||/^(I|EM)$/.test(g),
      u:fmt.u||g==='U', sup:fmt.sup||g==='SUP', sub:fmt.sub||g==='SUB'};
    if(g==='BR'){ out.push({t:'\n',br:true}); return; }
    out.push.apply(out,runsOf(n,f));
  });
  return out;
}
function figParts(fig){
  var fc=fig.querySelector('figcaption'), st=fc?fc.querySelector('strong'):null;
  var title=st?st.textContent.trim():'';
  var legend=fc?fc.textContent.replace(title,'').replace(/^\s*—\s*/,'').trim():'';
  return {title:title,legend:legend,layout:fig.dataset.layout==='one-column'?'one-column':'two-column'};
}
function parseBlocks(html){
  var d=document.createElement('div'); d.innerHTML=html||'';
  d.querySelectorAll('.gbmn-media-actions').forEach(function(n){n.remove()});
  var out=[];
  Array.prototype.forEach.call(d.children,function(el){
    var g=el.tagName;
    if(g==='FIGURE'&&el.classList.contains('gbmn-inline-media')){
      var p=figParts(el);
      if(el.classList.contains('gbmn-inline-media-figure')){
        var img=el.querySelector('img');
        out.push({t:'fig',title:p.title,legend:p.legend,layout:p.layout,src:img?img.getAttribute('src'):''});
      } else if(el.classList.contains('gbmn-inline-media-table')){
        var tb=el.querySelector('table'), rows=[];
        if(tb) Array.prototype.forEach.call(tb.querySelectorAll('tr'),function(tr){
          rows.push(Array.prototype.map.call(tr.children,function(c){return {text:c.textContent.trim(),head:c.tagName==='TH'}}));
        });
        out.push({t:'table',title:p.title,legend:p.legend,layout:p.layout,rows:rows});
      } else {
        out.push({t:'pre',title:p.title,legend:p.legend,layout:p.layout,text:el.textContent.replace(p.title,'').replace(p.legend,'').trim()});
      }
      return;
    }
    if(/^H[2-6]$/.test(g)){ out.push({t:'h',runs:runsOf(el,{})}); return; }
    if(g==='UL'||g==='OL'){
      out.push({t:'list',ordered:g==='OL',items:Array.prototype.map.call(el.children,function(li){return runsOf(li,{})})}); return; }
    if(g==='TABLE'){
      var rws=[]; Array.prototype.forEach.call(el.querySelectorAll('tr'),function(tr){
        rws.push(Array.prototype.map.call(tr.children,function(c){return {text:c.textContent.trim(),head:c.tagName==='TH'}}));});
      out.push({t:'table',title:'',legend:'',layout:'two-column',rows:rws}); return; }
    var r=runsOf(el,{});
    if(r.some(function(x){return !x.br&&x.t.trim()})) out.push({t:'p',runs:r});
  });
  return out;
}
/* the whole article as ordered sections of blocks */
function articleModel(){
  var secs=[];
  sectionNames().forEach(function(name){
    var html=(M.sections[name]||'').trim(); if(!html) return;
    secs.push({name:name,blocks:parseBlocks(html)});
  });
  var fign=0,tabn=0;
  secs.forEach(function(s){ s.blocks.forEach(function(b){
    if(b.t==='fig'||b.t==='pre') b.n=++fign; if(b.t==='table') b.n=++tabn; }); });
  return {secs:secs,figCount:fign,tabCount:tabn};
}

/* ══ image helpers ═════════════════════════════════════════════ */
function toPng(src){
  return new Promise(function(res){
    var im=new Image();
    im.onload=function(){ var c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight;
      c.getContext('2d').drawImage(im,0,0);
      var url=c.toDataURL('image/png');
      res({w:im.naturalWidth,h:im.naturalHeight,bytes:b64bytes(url.split(',')[1])}); };
    im.onerror=function(){ res(null); };
    im.src=src;
  });
}
function b64bytes(b64){ var bin=atob(b64), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a; }

/* ══ DOCX — written from the rendered proof, so Word matches it ══ */
function xe(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
var TEAL='00786D', RED='B9353A', GREY='686868', INK='1F2A2A';
function wRuns(runs){
  return runs.map(function(r){
    if(r.br) return '<w:r><w:br/></w:r>';
    var p=[];
    p.push('<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>');
    if(r.sz) p.push('<w:sz w:val="'+r.sz+'"/><w:szCs w:val="'+r.sz+'"/>');
    if(r.color) p.push('<w:color w:val="'+r.color+'"/>');
    if(r.b) p.push('<w:b/>'); if(r.i) p.push('<w:i/>'); if(r.u) p.push('<w:u w:val="single"/>');
    if(r.sup) p.push('<w:vertAlign w:val="superscript"/>');
    if(r.sub) p.push('<w:vertAlign w:val="subscript"/>');
    return '<w:r><w:rPr>'+p.join('')+'</w:rPr><w:t xml:space="preserve">'+xe(r.t)+'</w:t></w:r>';
  }).join('');
}
function wP(runs,o){
  o=o||{}; var pr=[];
  if(o.align) pr.push('<w:jc w:val="'+o.align+'"/>');
  if(o.indent) pr.push('<w:ind w:firstLine="'+o.indent+'"/>');
  if(o.hang) pr.push('<w:ind w:left="'+o.hang+'" w:hanging="'+o.hang+'"/>');
  if(o.bdr) pr.push('<w:pBdr><w:top w:val="single" w:sz="16" w:space="1" w:color="777777"/><w:bottom w:val="single" w:sz="8" w:space="1" w:color="777777"/></w:pBdr>');
  pr.push('<w:spacing w:before="'+(o.before||0)+'" w:after="'+(o.after==null?90:o.after)+'" w:line="'+(o.line||240)+'" w:lineRule="auto"/>');
  if(o.keep) pr.push('<w:keepNext/>');
  return '<w:p><w:pPr>'+pr.join('')+'</w:pPr>'+wRuns(runs)+'</w:p>';
}
function wTable(el,totalTw){
  var rows=Array.prototype.slice.call(el.rows);
  if(!rows.length) return '';
  var cols=rows.reduce(function(n,r){return Math.max(n,r.cells.length)},1);
  var w=Math.floor(totalTw/cols);
  var bd='<w:tblBorders>'+['top','left','bottom','right','insideH','insideV'].map(function(s){
    return '<w:'+s+' w:val="single" w:sz="4" w:space="0" w:color="AEBABA"/>'}).join('')+'</w:tblBorders>';
  return '<w:tbl><w:tblPr><w:tblW w:w="'+totalTw+'" w:type="dxa"/><w:tblLayout w:type="fixed"/>'+bd+'</w:tblPr>'+
    '<w:tblGrid>'+Array.apply(null,Array(cols)).map(function(){return '<w:gridCol w:w="'+w+'"/>'}).join('')+'</w:tblGrid>'+
    rows.map(function(r,ri){
      var head=r.cells[0]&&r.cells[0].tagName==='TH';
      return '<w:tr>'+(head?'<w:trPr><w:tblHeader/></w:trPr>':'')+
        Array.prototype.slice.call(r.cells).map(function(c){
          var runs=domRuns(c,{sz:18,b:head});
          return '<w:tc><w:tcPr><w:tcW w:w="'+w+'" w:type="dxa"/>'+(head?'<w:shd w:val="clear" w:fill="DFEEDD"/>':'')+
            '<w:vAlign w:val="center"/></w:tcPr>'+wP(runs.length?runs:[{t:'',sz:18}],{align:'center',after:0})+'</w:tc>';
        }).join('')+'</w:tr>';
    }).join('')+'</w:tbl>';
}
var WIMG=[];
function wImage(bytes,wPx,hPx,maxEmu,name){
  var id=WIMG.length+1, rid='rIdPic'+id;
  WIMG.push({rid:rid,name:'word/media/pic'+id+'.png',bytes:bytes});

    '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="0" name="'+xe(name||'pic')+'"/><pic:cNvPicPr/></pic:nvPicPr>'+
    '<pic:blipFill><a:blip r:embed="'+rid+'"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>'+
    '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+cx+'" cy="'+cy+'"/></a:xfrm>'+
    '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>';
}
/* DOM → runs, carrying the proof's own emphasis and colour */
function domRuns(node,base){
  base=base||{}; var out=[];
  Array.prototype.forEach.call(node.childNodes,function(n){
    if(n.nodeType===3){ var t=n.textContent.replace(/\s+/g,' ');
      if(t) out.push({t:t,b:base.b,i:base.i,u:base.u,sup:base.sup,sub:base.sub,sz:base.sz,color:base.color}); return; }
    if(n.nodeType!==1) return;
    if(n.tagName==='BR'){ out.push({br:true}); return; }
    var f=Object.assign({},base);
    if(/^(B|STRONG)$/.test(n.tagName)) f.b=true;
    if(/^(I|EM)$/.test(n.tagName)) f.i=true;
    if(n.tagName==='U') f.u=true;
    if(n.tagName==='SUP'){ f.sup=true; f.sz=Math.max(14,Math.round((base.sz||22)*0.64)); }
    if(n.tagName==='SUB') f.sub=true;
    if(n.classList&&(n.classList.contains('lb'))){ f.color=TEAL; f.b=true; }
    if(n.tagName==='SUP'||n.tagName==='A'){ f.color=f.color||TEAL; }

/* one proof element → an array of docx XML blocks */
async function domToDocx(el,colTw,colEmu){
  var out=[], tag=el.tagName, cl=el.classList;
  if(cl.contains('ptitle')){ out.push(wP(domRuns(el,{sz:39,b:true,color:TEAL}),{align:'center',before:160,after:150})); return out; }
  if(cl.contains('pauth')){ out.push(wP(domRuns(el,{sz:24,color:GREY}),{align:'center',after:170})); return out; }
  if(cl.contains('pabs-h')){ out.push(wP([{t:el.textContent,sz:22,b:true,color:RED}],{after:40,keep:true})); return out; }
  if(cl.contains('pabs')){
    Array.prototype.forEach.call(el.children,function(p){ out.push(wP(domRuns(p,{sz:20}),{align:'both',after:0,line:230})); });
    return out; }
  if(cl.contains('pdoi')){ out.push(wP(domRuns(el,{sz:22,b:true,color:'008080',u:true}),{before:110,after:160})); return out; }
  if(tag==='H2'){ out.push(wP([{t:el.textContent.toUpperCase(),sz:22,b:true,color:RED}],{before:150,after:30,keep:true})); return out; }
  if(tag==='H3'){ out.push(wP(domRuns(el,{sz:22,b:true,i:true,color:TEAL}),{before:110,after:30,keep:true})); return out; }
  if(tag==='FIGURE'){
    var img=el.querySelector('img'), pre=el.querySelector('pre'), cap=el.querySelector('.cap');
    if(img){ var p=await toPng(img.getAttribute('src')); if(p) out.push(wImage(p.bytes,p.w,p.h,colEmu,img.alt||'Figure')); }
    else if(pre) out.push(wP([{t:pre.textContent,sz:17}],{after:40}));
    if(cap) out.push(wP(domRuns(cap,{sz:17}),{align:'both',after:120}));
    return out; }
  if(cl.contains('tbl')){
    var c=el.querySelector('.cap'), t=el.querySelector('table');
    if(c) out.push(wP(domRuns(c,{sz:17}),{align:'both',after:40,keep:true}));
    if(t) out.push(wTable(t,colTw));
    out.push(wP([{t:'',sz:10}],{after:80}));
    return out; }
  if(cl.contains('decl')||cl.contains('afflist')){
    var sz=cl.contains('afflist')?19:22;
    Array.prototype.forEach.call(el.children,function(p){ out.push(wP(domRuns(p,{sz:sz}),{align:'both',after:60})); });
    return out; }
  if(tag==='OL'&&cl.contains('refs')){
    var start=parseInt(el.getAttribute('start')||'1',10);
    Array.prototype.forEach.call(el.children,function(li,k){
      out.push(wP([{t:(start+k)+'. ',sz:19}].concat(domRuns(li,{sz:19})),{align:'both',hang:255,after:30})); });
    return out; }
  if(tag==='OL'||tag==='UL'){
    Array.prototype.forEach.call(el.children,function(li,k){
      out.push(wP([{t:(tag==='OL'?(k+1)+'. ':'• '),sz:22}].concat(domRuns(li,{sz:22})),{hang:255,after:30})); });
    return out; }
  if(tag==='P'){
    out.push(wP(domRuns(el,{sz:22}),{align:'both',indent:cl.contains('first')?0:283,after:0,line:273}));
    return out; }
  for(var i=0;i<el.children.length;i++) out.push.apply(out,await domToDocx(el.children[i],colTw,colEmu));
  return out;
}

var JOURNAL={ title:'Georgian Biomedical and Medical Nexus', abbrev:'Georgian Biomed Med Nexus',

  publisher:'Tbilisi State Medical University', loc:'Tbilisi, Georgia' };
var JATS_TYPE={'original-research':'research-article','review-articles':'review-article',
  'clinical-cases':'case-report','commentary':'article-commentary','other':'other'};

function jRuns(runs){
  return runs.map(function(r){
    if(r.br) return ' ';
    var t=xe(r.t);
    if(r.sup) t='<sup>'+t+'</sup>'; if(r.sub) t='<sub>'+t+'</sub>';
    if(r.b) t='<bold>'+t+'</bold>'; if(r.i) t='<italic>'+t+'</italic>'; if(r.u) t='<underline>'+t+'</underline>';
    return t; }).join('');
}
function pubDateParts(){
  var pv=M.preview||{}, d=pv.date?new Date(pv.date+'T00:00:00'):null;
  if(d&&!isNaN(d)) return {y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate()};
  return {y:parseInt(pv.year,10)||new Date().getFullYear(),m:0,d:0};
}
function refPersons(authors){
  var parts=String(authors||'').split(/\s*,\s*/).filter(Boolean);
  return parts.map(function(p){
    var m=p.match(/^(.+?)\s+([A-Za-z]{1,4})\.?$/);
    if(m) return '<name><surname>'+xe(m[1])+'</surname><given-names>'+xe(m[2])+'</given-names></name>';
    return '<string-name>'+xe(p)+'</string-name>';
  }).join('');
}
function jatsRef(r,i){
  var type = r.type==='book'?'book':(r.type==='web'?'webpage':'journal');
  var s='<ref id="R'+(i+1)+'"><label>'+(i+1)+'</label><element-citation publication-type="'+type+'">';
  s+='<person-group person-group-type="author">'+refPersons(r.authors)+'</person-group>';
  if(r.title) s+='<article-title>'+xe(r.title)+'</article-title>';
  if(r.journalOrBook) s+='<source>'+xe(r.journalOrBook)+'</source>';
  if(r.year) s+='<year iso-8601-date="'+xe(r.year)+'">'+xe(r.year)+'</year>';
  if(r.volume) s+='<volume>'+xe(r.volume)+'</volume>';
  if(r.issue) s+='<issue>'+xe(r.issue)+'</issue>';
  if(r.pages){ var pp=String(r.pages).split(/[-–]/);
    s+='<fpage>'+xe(pp[0])+'</fpage>'+(pp[1]?'<lpage>'+xe(pp[1])+'</lpage>':''); }
  if(r.doi) s+='<pub-id pub-id-type="doi">'+xe(r.doi)+'</pub-id>';
  if(r.url) s+='<ext-link ext-link-type="uri" xlink:href="'+xe(r.url)+'">'+xe(r.url)+'</ext-link>';
  return s+'</element-citation></ref>';
}

    x+='<sec id="sec'+sn+'"'+(st?' sec-type="'+st+'"':'')+'><title>'+xe(s.name)+'</title>';
    /* a subheading opens a nested <sec>; everything after it belongs inside, because
       JATS does not allow a <p> to follow a nested <sec> in the same parent */
    var sub=0, open=false;
    s.blocks.forEach(function(b){
      if(b.t==='h'){ if(open) x+='</sec>'; sub++; open=true;
        x+='<sec id="sec'+sn+'-'+sub+'"><title>'+jRuns(b.runs)+'</title>'; return; }
      if(b.t==='p') x+='<p>'+jRuns(b.runs)+'</p>';
      else if(b.t==='list') x+='<list list-type="'+(b.ordered?'order':'bullet')+'">'+
        b.items.map(function(it){return '<list-item><p>'+jRuns(it)+'</p></list-item>'}).join('')+'</list>';
      else if(b.t==='fig') x+='<fig id="fig'+b.n+'" position="float"><label>Figure '+b.n+'</label>'+
        '<caption><title>'+xe(b.title)+'</title>'+(b.legend?'<p>'+xe(b.legend)+'</p>':'')+'</caption>'+
        '<graphic xlink:href="'+xe(figNames[b.n]||(base+'-fig'+b.n+'.png'))+'"/></fig>';
      else if(b.t==='table'){
        x+='<table-wrap id="tbl'+b.n+'" position="float"><label>Table '+b.n+'</label>'+
           '<caption><title>'+xe(b.title)+'</title></caption><table frame="hsides" rules="groups">';
        var head=b.rows.length&&b.rows[0].every(function(c){return c.head})?b.rows[0]:null;
        if(head) x+='<thead><tr>'+head.map(function(c){return '<th>'+xe(c.text)+'</th>'}).join('')+'</tr></thead>';
        x+='<tbody>'+b.rows.slice(head?1:0).map(function(r){
          return '<tr>'+r.map(function(c){return '<td>'+xe(c.text)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>'+
           (b.legend?'<table-wrap-foot><fn><p>'+xe(b.legend)+'</p></fn></table-wrap-foot>':'')+'</table-wrap>';
      }
      else if(b.t==='pre') x+='<boxed-text id="box'+b.n+'"><caption><title>'+xe(b.title)+'</title></caption><preformat>'+xe(b.text)+'</preformat></boxed-text>';
    });
    if(open) x+='</sec>';
    x+='</sec>';
  });
  x+='\n</body>\n<back>\n';
  var ack=A.secs.filter(function(s){return s.name==='Acknowledgments'})[0];
  if(ack&&ack.blocks.length) x+='<ack><title>Acknowledgments</title>'+
    ack.blocks.map(function(b){return b.t==='p'?'<p>'+jRuns(b.runs)+'</p>':''}).join('')+'</ack>';
  var E=M.ethics, C=M.conflictDisclosure, fns=[];
  fns.push('<fn fn-type="COI-statement"><p>'+xe(C.hasConflict?(C.conflictDetails||'The authors declare conflicts of interest.'):'The authors declare no conflict of interest.')+'</p></fn>');
  var ethTxt=declRows().filter(function(r){return r[0]==='Ethics approval'})[0];
  if(ethTxt) fns.push('<fn fn-type="other"><label>Ethics approval</label><p>'+xe(ethTxt[1])+'</p></fn>');
  var contrib=declRows().filter(function(r){return r[0]==='Author contributions'})[0];
  if(contrib) fns.push('<fn fn-type="con"><label>Author contributions</label><p>'+xe(contrib[1])+'</p></fn>');
  x+='<fn-group>'+fns.join('')+'</fn-group>';
  if(M.references.length) x+='<ref-list><title>References</title>'+M.references.map(jatsRef).join('')+'</ref-list>';
  x+='\n</back>\n</article>\n';
  return x;
}
async function exportJats(){

/* ══ PubMed 3.0 citation XML ═══════════════════════════════════ */
function buildPubmed(){
  var pv=M.preview||{}, pd=pubDateParts(), MO=['','01','02','03','04','05','06','07','08','09','10','11','12'];
  var x='<?xml version="1.0" encoding="UTF-8"?>\n';
  x+='<!DOCTYPE ArticleSet PUBLIC "-//NLM//DTD PubMed 3.0//EN" "https://dtd.nlm.nih.gov/ncbi/pubmed/in/PubMed.dtd">\n';
  x+='<ArticleSet>\n<Article>\n';
  x+='<Journal><PublisherName>'+xe(JOURNAL.publisher)+'</PublisherName>'+
     '<JournalTitle>'+xe(JOURNAL.title)+'</JournalTitle>'+
     '<Issn>'+JOURNAL.issnE+'</Issn>'+
     (pv.vol?'<Volume>'+xe(pv.vol)+'</Volume>':'')+
     (pv.iss?'<Issue>'+xe(pv.iss)+'</Issue>':'')+
     '<PubDate PubStatus="epublish"><Year>'+pd.y+'</Year>'+
       (pd.m?'<Month>'+MO[pd.m]+'</Month>':'')+(pd.m&&pd.d?'<Day>'+(pd.d<10?'0':'')+pd.d+'</Day>':'')+
     '</PubDate></Journal>\n';
  x+='<ArticleTitle>'+xe(M.title)+'</ArticleTitle>\n';
  if(pv.fpage){ x+='<FirstPage>'+xe(pv.fpage)+'</FirstPage>'+(pv.lpage?'<LastPage>'+xe(pv.lpage)+'</LastPage>':'')+'\n'; }
  else if(pv.elocation) x+='<ELocationID EIdType="pii">'+xe(pv.elocation)+'</ELocationID>\n';
  if((M.publicationInfo||{}).doi) x+='<ELocationID EIdType="doi">'+xe(M.publicationInfo.doi)+'</ELocationID>\n';
  x+='<Language>EN</Language>\n<AuthorList>';
  M.authors.forEach(function(a){
    x+='<Author><FirstName>'+xe(a.firstName)+'</FirstName>'+
       (a.middleInitial?'<MiddleName>'+xe(a.middleInitial.replace(/\.$/,''))+'</MiddleName>':'')+
       '<LastName>'+xe(a.lastName)+'</LastName>';
    (a.affiliations&&a.affiliations.length?a.affiliations:[a.affiliation]).filter(Boolean).forEach(function(af){
      x+='<AffiliationInfo><Affiliation>'+xe(af)+'</Affiliation></AffiliationInfo>'; });
    if(a.orcidId) x+='<AffiliationInfo><Identifier Source="ORCID">https://orcid.org/'+
      xe(a.orcidId.replace(/^https?:\/\/orcid\.org\//i,''))+'</Identifier></AffiliationInfo>';
    x+='</Author>';
  });
  x+='</AuthorList>\n';
  x+='<PublicationType>'+xe(PM_TYPE[M.articleType]||'Journal Article')+'</PublicationType>\n';
  if((M.publicationInfo||{}).doi) x+='<ArticleIdList><ArticleId IdType="doi">'+xe(M.publicationInfo.doi)+'</ArticleId></ArticleIdList>\n';
  var abs=stripTags(M.abstractContents.text||'');
  if(abs) x+='<Abstract><AbstractText>'+xe(abs)+'</AbstractText></Abstract>\n';
  var kws=(M.sections['Keywords']||'').replace(/\.$/,'').split(/[;,]/).map(function(k){return k.trim()}).filter(Boolean);
  var F=M.fundingDetails, objs='';
  kws.forEach(function(k){ objs+='<Object Type="keyword"><Param Name="value">'+xe(k)+'</Param></Object>'; });
  if(F.grantNumber||F.fundingAgency) objs+='<Object Type="grant">'+
    (F.grantNumber?'<Param Name="id">'+xe(F.grantNumber)+'</Param>':'')+
    (F.fundingAgency?'<Param Name="grantor">'+xe(F.fundingAgency)+'</Param>':'')+'</Object>';
  if(objs) x+='<ObjectList>'+objs+'</ObjectList>\n';
  x+='<CopyrightInformation>&#169; '+pd.y+' The Authors. Open access under CC BY 4.0.</CopyrightInformation>\n';
  var C=M.conflictDisclosure;
  x+='<CoiStatement>'+xe(C.hasConflict?(C.conflictDetails||'The authors declare conflicts of interest.'):'The authors declare no conflict of interest.')+'</CoiStatement>\n';
  if(M.references.length) x+='<ReferenceList>'+M.references.map(function(r){
    return '<Reference><Citation>'+xe(formatAMAReference(r).replace(/\*/g,''))+'</Citation>'+
      (r.doi?'<ArticleIdList><ArticleId IdType="doi">'+xe(r.doi)+'</ArticleId></ArticleIdList>':'')+'</Reference>'; }).join('')+'</ReferenceList>\n';
  x+='</Article>\n</ArticleSet>\n';
  return x;
}
function exportPubmed(){
  dl(slug()+'-pubmed.xml', new Blob([buildPubmed()],{type:'application/xml;charset=utf-8'}));
  notify('PubMed citation XML downloaded.','success');
}

}

function webBlocks(name){
  var d=document.createElement('div'); d.innerHTML=(M.sections[name]||'').trim();
  d.querySelectorAll('.gbmn-media-actions').forEach(function(n){n.remove()});
  d.querySelectorAll('[contenteditable]').forEach(function(n){n.removeAttribute('contenteditable')});
  d.querySelectorAll('[draggable]').forEach(function(n){n.removeAttribute('draggable')});
  var out='';
  Array.prototype.forEach.call(d.children,function(el){
    if(el.tagName==='FIGURE'&&el.classList.contains('gbmn-inline-media')){
      var fc=el.querySelector('figcaption'), st=fc?fc.querySelector('strong'):null;
      var title=st?st.textContent.trim():'', legend=fc?fc.textContent.replace(title,'').replace(/^\s*—\s*/,'').trim():'';
      var wide=el.dataset.layout==='one-column'?' class="wide"':'';
      var inner='';
      if(el.classList.contains('gbmn-inline-media-figure')){
        WEBN.fig++; var img=el.querySelector('img');
        inner=img?'<img src="'+esc(img.getAttribute('src'))+'" alt="'+esc(title)+'">':'';
        out+='<figure'+wide+'>'+inner+'<figcaption><b>Figure '+WEBN.fig+'.</b> '+esc(title)+(legend?' '+esc(legend):'')+'</figcaption></figure>';
      } else if(el.classList.contains('gbmn-inline-media-table')){
        WEBN.tab++; var tb=el.querySelector('table');
        out+='<figure'+wide+'><figcaption style="margin:0 0 10px;padding:0 0 10px;border-top:0;border-bottom:1px solid var(--hair)"><b>Table '+WEBN.tab+'.</b> '+
          esc(title)+(legend?' '+esc(legend):'')+'</figcaption><div class="tablewrap">'+(tb?tb.outerHTML.replace(/ class="[^"]*"/g,''):'')+'</div></figure>';
      } else {
        WEBN.fig++; var pre=el.querySelector('pre');
        out+='<figure'+wide+'><pre>'+esc(pre?pre.textContent:el.textContent)+'</pre>'+
          '<figcaption><b>Figure '+WEBN.fig+'.</b> '+esc(title)+(legend?' '+esc(legend):'')+'</figcaption></figure>';
      }
      return;
    }
    if(/^H[2-6]$/.test(el.tagName)){ out+='<h3>'+el.innerHTML+'</h3>'; return; }
    if(el.tagName==='UL'||el.tagName==='OL'){ out+=el.outerHTML; return; }
    out+='<p>'+el.innerHTML+'</p>';
  });
  return out;
}

function declRows(){

  else if(E.humanSubjectsApproved==='not-applicable') eth.push('Ethics approval was not applicable to this work.');
  if(E.informedConsentObtained==='yes') eth.push('Written informed consent was obtained from all subjects.');

/* live section DOMs — the editable source behind the proof */
var SECDOM={}, MEDIA={fig:0,tab:0};
function secDom(name){
  var d=document.createElement('div'); d.innerHTML=(M.sections[name]||'').trim();
  d.querySelectorAll('.gbmn-media-actions').forEach(function(n){n.remove()});
  d.querySelectorAll('[contenteditable]').forEach(function(n){n.removeAttribute('contenteditable')});
  d.querySelectorAll('[draggable]').forEach(function(n){n.removeAttribute('draggable')});
  SECDOM[name]=d; return d;

function mkEl(html){ var t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }

/* one source node → one proof node */
function blockNode(src,prev,name,i){
  var tag=src.tagName;
  var one = (src.dataset&&src.dataset.layout==='one-column') ? ' one-col' : '';
  var tagAttr=' data-sec="'+esc(name)+'" data-i="'+i+'"';
  if(tag==='FIGURE'&&src.classList.contains('gbmn-inline-media')){
    var fc=src.querySelector('figcaption'), st=fc?fc.querySelector('strong'):null;
    var title=st?st.textContent.trim():'';
    var legend=fc?fc.textContent.replace(title,'').replace(/^\s*—\s*/,'').trim():'';
    var cap=(title+(legend?' '+legend:'')).trim();
    if(src.classList.contains('gbmn-inline-media-table')){
      MEDIA.tab++;
      var tb=src.querySelector('table'), head='', body='';
      if(tb){
        var rows=Array.prototype.slice.call(tb.querySelectorAll('tr'));
        var hasHead=rows.length&&Array.prototype.every.call(rows[0].children,function(c){return c.tagName==='TH'});
        if(hasHead) head='<thead><tr>'+Array.prototype.map.call(rows[0].children,function(c){return '<th>'+c.innerHTML+'</th>'}).join('')+'</tr></thead>';
        body='<tbody>'+rows.slice(hasHead?1:0).map(function(tr){
          return '<tr>'+Array.prototype.map.call(tr.children,function(c){return '<td>'+c.innerHTML+'</td>'}).join('')+'</tr>'; }).join('')+'</tbody>';
      }
      return mkEl('<div class="tbl'+one+'"'+tagAttr+' data-kind="table">'+
        '<div class="cap" data-cap><b>Table '+MEDIA.tab+'.</b> '+esc(cap||'Caption')+'</div>'+
        (tb?'<table>'+head+body+'</table>':'')+'</div>');
    }
    MEDIA.fig++;
    var img=src.querySelector('img'), pre=src.querySelector('pre');
    var inner = img ? '<img src="'+esc(img.getAttribute('src'))+'" alt="Figure '+MEDIA.fig+'">'
              : '<pre>'+esc(pre?pre.textContent:src.textContent)+'</pre>';
    return mkEl('<figure class="fg'+one+'"'+tagAttr+' data-kind="fig">'+inner+
      '<div class="cap" data-cap><b>Figure '+MEDIA.fig+'.</b> '+esc(cap||'Caption')+'</div></figure>');
  }
  if(/^H[2-6]$/.test(tag)) return mkEl('<h3'+tagAttr+' data-kind="h">'+src.innerHTML+'</h3>');
  if(tag==='UL'||tag==='OL'){ var n=src.cloneNode(true); n.setAttribute('data-sec',name); n.setAttribute('data-i',i); n.setAttribute('data-kind','list'); return n; }
  var after = prev && /^H[2-6]$/.test(prev.tagName);
  var p=mkEl('<p'+tagAttr+' data-kind="p">'+src.innerHTML+'</p>');
  if(after||i===0) p.className='first';
  return p;
}
/* every flowable node of the article body, in printed order */
function bodyNodes(){
  MEDIA={fig:0,tab:0};
  var out=[];
  function heading(t){ var h=document.createElement('h2'); h.textContent=t.toUpperCase(); out.push(h); }
  sectionNames().filter(function(s){return s!=='Acknowledgments'}).forEach(function(name){
    var d=secDom(name), kids=Array.prototype.slice.call(d.children);
    if(!kids.length) return;
    heading(name);
    kids.forEach(function(k,i){ var n=blockNode(k,kids[i-1],name,i); if(n) out.push(n); });
  });
  var affs=affilList();
  if(affs.length){
    heading('Author affiliation');

    out.push(box);
  }
  var corr=M.authors.filter(function(a){return a.isCorresponding})[0];
  if(corr){

    out.push(c);

  if((M.sections['Acknowledgments']||'').trim()){
    heading('Acknowledgements');
    var ad=secDom('Acknowledgments'), ak=Array.prototype.slice.call(ad.children);
    ak.forEach(function(k,i){ var n=blockNode(k,ak[i-1],'Acknowledgments',i); if(n) out.push(n); });
  }
  var rows=declRows();

    heading('Declarations');
    var dv=document.createElement('div'); dv.className='decl';
    dv.innerHTML=rows.map(function(r){return '<p><b>'+esc(r[0])+'.</b> '+esc(r[1])+'</p>'}).join('');

  if(M.references.length){

      var ol=document.createElement('ol'); ol.className='refs'; ol.setAttribute('start',String(i+1));
      var li=document.createElement('li'); li.innerHTML=ital(formatAMAReference(r)); ol.appendChild(li); out.push(ol); });
  }

}

/* ══ pagination — real A4 pages, masthead and footer on each ══ */
function fitsIn(box){ return box.scrollWidth <= box.clientWidth + 1 && box.scrollHeight <= box.clientHeight + 1; }
function splitBlock(box,node){
  if(node.tagName!=='P'||node.querySelector('img,table,figure')) return null;
  var words=(node.textContent||'').split(/\s+/).filter(Boolean);
  if(words.length<30) return null;
  var head=node.cloneNode(false); head.removeAttribute('data-sec'); head.removeAttribute('data-i');
  box.appendChild(head);
  var lo=0,hi=words.length,best=0;
  while(lo<=hi){ var mid=(lo+hi)>>1; head.textContent=words.slice(0,mid).join(' ');
    if(fitsIn(box)){ best=mid; lo=mid+1; } else hi=mid-1; }
  if(best<15){ box.removeChild(head); return null; }
  head.textContent=words.slice(0,best).join(' ');
  var tail=node.cloneNode(false); tail.textContent=words.slice(best).join(' ');
  tail.removeAttribute('data-sec'); tail.removeAttribute('data-i');
  tail.style.textIndent='0';
  return tail;
}
function paginate(){
  var sc=$('#scroller'); sc.innerHTML='';
  var queue=bodyNodes(), i=0, guard=0;
  do{
    var pg=pageShell(guard===0); sc.appendChild(pg);
    var box=pg.querySelector('.pbody');
    while(i<queue.length){
      var node=queue[i].cloneNode(true);
      box.appendChild(node);
      if(fitsIn(box)){ i++; continue; }
      box.removeChild(node);
      if(!box.children.length){ box.appendChild(node); i++; break; }
      var tail=splitBlock(box,queue[i]);
      if(tail) queue[i]=tail;
      break;
    }
    guard++;
  } while(i<queue.length && guard<120);
  return guard;
}

/* ══ editorial inline editing of the proof ═════════════════════ */
var PROOF_DIRTY=false;
function logEdit(where){
  M.editLog=M.editLog||[];
  M.editLog.push({at:new Date().toISOString(),role:M.role,where:where});
  if(M.editLog.length>200) M.editLog=M.editLog.slice(-200);
}
function wireProofEditing(){
  if(M.role==='author') return;
  $$('#scroller [data-sec]').forEach(function(blk){
    var name=blk.dataset.sec, i=+blk.dataset.i;
    var cap=blk.querySelector('[data-cap]');
    var target=cap||blk;
    target.setAttribute('contenteditable','true');
    target.setAttribute('spellcheck','true');
    target.addEventListener('input',function(){ PROOF_DIRTY=true; });
    target.addEventListener('blur',function(){
      if(!PROOF_DIRTY) return; PROOF_DIRTY=false;
      var d=SECDOM[name]; if(!d||!d.children[i]) return;
      var src=d.children[i];
      if(cap){
        var txt=cap.textContent.replace(/^\s*(Figure|Table)\s*\d+\.\s*/i,'').trim();
        var fc=src.querySelector('figcaption');
        if(fc) fc.innerHTML='<strong>'+esc(txt)+'</strong>';
      } else {
        var t=src.tagName.toLowerCase();
        if(/^h[2-6]$/.test(t)) src.innerHTML=blk.innerHTML;
        else if(t==='ul'||t==='ol') src.innerHTML=blk.innerHTML;
        else src.innerHTML=blk.innerHTML;
      }
      M.sections[name]=d.innerHTML;
      logEdit(name); save(); renderSidebar(); renderPreview();
    });
  });
}

/* ══ validation ════════════════════════════════════════════════ */
function validate(){
  var p=[], c=cfg();
  if(!M.title.trim()) p.push('Title is empty.');
  if(!M.runningTitle.trim()) p.push('Running title is empty.');
  if(!M.specialty.trim()) p.push('Primary medical specialty is empty.');
  if(!M.checklistAgreed) p.push('The manuscript integrity checklist has not been accepted.');
  if(!M.authors.length) p.push('No authors have been added.');
  if(M.authors.length && !M.authors.some(function(a){return a.isCorresponding})) p.push('No corresponding author is marked.');
  M.authors.forEach(function(a){ if(!a.orcidId) p.push([a.firstName,a.lastName].filter(Boolean).join(' ')+' has no ORCID iD.'); });
  if(c&&c.abstractType!=='none'){
    var aw=stripTags(M.abstractContents.text||''); aw=aw?aw.split(/\s+/).length:0;
    if(!aw) p.push('Abstract is empty.'); else if(aw>250) p.push('Abstract is '+aw+' words — the limit is 250.'); }
  var kn=(M.sections['Keywords']||'').split(/[;,]/).map(function(x){return x.trim()}).filter(Boolean).length;
  if(!kn) p.push('No keywords entered.'); else if(kn<3||kn>6) p.push(kn+' keywords — 3 to 6 are required.');
  sectionNames().filter(function(s){return s!=='Acknowledgments'}).forEach(function(s){
    if(stripTags(M.sections[s]||'').length<100) p.push('Section "'+s+'" is empty or too short.'); });
  var w=wordCount(); if(c&&w>c.maxWordCount) p.push('Body is '+w+' words — the limit for '+c.name+' is '+c.maxWordCount+'.');
  if(!M.references.length) p.push('Reference list is empty.');
  else { if(c&&M.references.length>c.maxReferences) p.push(M.references.length+' references — the limit for '+c.name+' is '+c.maxReferences+'.');
    M.references.forEach(function(r,i){ if(!r.authors||!r.title||!r.year||!r.journalOrBook) p.push('Reference '+(i+1)+' is incomplete.'); }); }
  var A=articleModel();
  if(c&&(A.figCount+A.tabCount)>c.maxFiguresTables) p.push((A.figCount+A.tabCount)+' figures/tables — the limit for '+c.name+' is '+c.maxFiguresTables+'.');
  if(M.conflictDisclosure.hasConflict && !M.conflictDisclosure.signedCoiFormName) p.push('A signed COI form is required when conflicts are declared.');
  return p;
}
function paintIssues(box){
  box=box||$('#pvIssues'); if(!box) return;
  var p=validate();
  if(!p.length){ box.innerHTML='<b style="color:var(--em700)">No issues</b><div class="note" style="margin-top:4px">The manuscript is ready to submit.</div>'; return; }
  box.innerHTML='<b style="color:var(--amber700)">'+p.length+(p.length===1?' item to fix':' items to fix')+'</b>'+
    '<ul style="margin:6px 0 0;padding-left:18px;font-size:11.5px;line-height:1.6;color:var(--s600)">'+
    p.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
}

/* ══ preview ═══════════════════════════════════════════════════ */
var pvMode='print';
function setMode(m){ pvMode=m;
  $$('#pvTgl button').forEach(function(x){ x.setAttribute('aria-selected', x.dataset.pv===m?'true':'false'); });
  renderPreview(); }
function fitPreview(){
  var wrap=$('#prevWrap'), sc=$('#scroller'), pane=$('#prevPane');
  if(!wrap||!sc||!pane) return;
  if(sc.classList.contains('webmode')||window.matchMedia('(max-width:1040px)').matches){
    sc.style.removeProperty('--pvs'); wrap.style.height='auto'; return; }
  var s=Math.min(1, pane.clientWidth/(sc.offsetWidth||1));
  sc.style.setProperty('--pvs',String(s));
  wrap.style.height=Math.ceil(sc.offsetHeight*s)+'px';
}
window.addEventListener('resize',function(){ fitPreview(); });
/* pagination measures real boxes, so every image must be decoded first —
   otherwise an undecoded figure is 0 px tall and the page overfills */
var IMG_READY={};
function imageSources(){
  var out=[LOGO];
  sectionNames().concat(['Acknowledgments']).forEach(function(s){
    var html=M.sections[s]||'';
    var re=/<img[^>]+src="([^"]+)"/g, m;
    while((m=re.exec(html))) out.push(m[1]);
  });
  return out;
}
function ensureImages(){
  var pending=imageSources().filter(function(s){ return s && !IMG_READY[s]; });
  if(!pending.length) return Promise.resolve(false);
  return Promise.all(pending.map(function(s){
    return new Promise(function(res){ var im=new Image();
      im.onload=im.onerror=function(){ IMG_READY[s]=1; res(); }; im.src=s; });
  })).then(function(){ return true; });
}
function renderPreview(){
  var sc=$('#scroller');
  if(pvMode==='print'){
    sc.classList.remove('webmode');
    var n=paginate();
    ensureImages().then(function(fresh){ if(fresh) renderPreview(); });
    wireProofEditing();
    $('#pvNote').textContent='A4 · '+n+' page'+(n===1?'':'s')+' · two columns · '+wordCount()+' words'+
      (M.role!=='author'?' · click the text to correct it':'');
  } else if(pvMode==='title'){
    sc.classList.remove('webmode');
    sc.innerHTML=titlePageHtml();
    $('#pvNote').textContent='separate title page';
  } else {
    sc.classList.add('webmode');
    sc.innerHTML='<iframe id="webFrame" title="Web article"></iframe>';
    $('#webFrame').srcdoc=webDocument();
    $('#pvNote').textContent='exactly what the HTML export contains';
  }
  fitPreview();
  if($('#pvIssues')) paintIssues($('#pvIssues'));
  if($('#sumIssues')) paintIssues($('#sumIssues'));
}
$('#pvTgl').addEventListener('click',function(e){ var b=e.target.closest('button[data-pv]'); if(b) setMode(b.dataset.pv); });

/* ══ exports ═══════════════════════════════════════════════════ */
function slug(){ var a=M.authors[0], base=(a&&a.lastName)?a.lastName:'manuscript', pv=M.preview||{};
  return ('GBMN-'+(pv.year||'')+'-'+(pv.vol||'')+'-'+(pv.iss||'')+'-'+base).replace(/[^A-Za-z0-9\-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,''); }
function dl(name,blob){ var u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },1500); }
function exportJson(){
  var meta={ id:M.id, status:M.status, role:M.role, articleType:M.articleType, title:M.title, runningTitle:M.runningTitle,
    specialty:M.specialty, publicationInfo:M.publicationInfo, preview:M.preview, checklistAgreed:M.checklistAgreed,
    authors:M.authors, abstractContents:M.abstractContents, sections:M.sections, references:M.references,
    supplementaryFiles:M.supplementaryFiles, ethics:M.ethics,
    conflictDisclosure:{hasConflict:M.conflictDisclosure.hasConflict,conflictDetails:M.conflictDisclosure.conflictDetails,signedCoiFormName:M.conflictDisclosure.signedCoiFormName},
    fundingDetails:M.fundingDetails, editLog:M.editLog||[], wordCount:wordCount(), updatedAt:M.updatedAt };
  dl(slug()+'.json', new Blob([JSON.stringify(meta,null,2)],{type:'application/json'}));
}
function printProof(){ if(pvMode!=='print') setMode('print'); setTimeout(function(){ window.print(); },200); }
$('#btnPdf').addEventListener('click',printProof);
$('#btnHtml').addEventListener('click',exportHtml);
$('#btnDocx').addEventListener('click',function(){ exportDocx(); });
$('#btnJats').addEventListener('click',function(){ exportJats(); });
$('#btnPubmed').addEventListener('click',exportPubmed);

/* ══ boot ══════════════════════════════════════════════════════ */
function renderAll(){ renderSidebar(); renderStep(); renderPreview(); }
renderAll();
})();
</script>
